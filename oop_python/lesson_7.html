            return `
                <div class="code-block p-3 rounded-lg overflow-x-auto">
                    <pre class="text-sm font-mono whitespace-pre-wrap">${escaped}</pre>
                </div>
            `;

                        <h2 class="text-3xl md:text-4xl font-bold text-[#6A0DAD] mb-4">1. Introduction to File Handling</h2>
                        <p class="text-dark-secondary leading-relaxed">File handling is the process of storing, retrieving, and manipulating data stored in files on your computer's storage system. Python provides built-in functions to work with files using the <span class="font-bold text-[#6A0DAD]">open()</span> function.</p>
                        <div class="grid md:grid-cols-2 gap-3 mt-3">
                            <div class="p-2 bg-[#6A0DAD]/5 rounded-lg border-l-4 border-[#6A0DAD]">

                                <ul class="bulleted-list text-xs text-dark-secondary">
                                    <li>Data persistence — data survives after program ends</li>
                                    <li>Share data between programs</li>
                                    <li>Process large datasets</li>
                                    <li>Store configuration and settings</li>
                                    <li>Log application activity</li>
                                </ul>
                            </div>
                            <div class="p-2 bg-[#008000]/5 rounded-lg border-l-4 border-[#008000]">
                                <p class="font-bold text-[#008000] text-sm">File Types</p>
                                <ul class="bulleted-list text-xs text-dark-secondary">
                                    <li><span class="font-bold">Text files:</span> .txt, .csv, .json, .xml</li>
                                    <li><span class="font-bold">Binary files:</span> .jpg, .png, .pdf, .exe</li>
                                    <li><span class="font-bold">Python can handle both</span></li>
                                </ul>
                            </div>
                        </div>
                    </div>
                `
        }, {
            // Slide 3 - File Modes
            content: () => `
                    <div class="glass-card-oop rounded-3xl p-8 md:p-10">
                        <h2 class="text-3xl md:text-4xl font-bold text-[#6A0DAD] mb-4">File Modes</h2>
                        <div class="overflow-x-auto">
                            <table class="comparison-table w-full border-collapse text-sm">
                                <thead><tr><th>Mode</th><th>Description</th><th>Action</th></tr></thead>

                                    <tr><td class="font-bold text-[#6A0DAD]">"r"</td><td>Read (default)</td><td>Opens a file for reading. Error if file doesn't exist.</td></tr>
                                    <tr><td class="font-bold text-[#008000]">"w"</td><td>Write</td><td>Opens a file for writing. Creates/overwrites file.</td></tr>
                                    <tr><td class="font-bold text-[#2979FF]">"a"</td><td>Append</td><td>Opens a file for appending. Creates file if it doesn't exist.</td></tr>
                                    <tr><td class="font-bold text-[#C0392B]">"x"</td><td>Exclusive creation</td><td>Creates a new file. Error if file exists.</td></tr>
                                    <tr><td class="font-bold text-[#6A0DAD]">"r+"</td><td>Read and Write</td><td>Opens for reading and writing. Error if file doesn't exist.</td></tr>
                                    <tr><td class="font-bold text-[#008000]">"w+"</td><td>Write and Read</td><td>Opens for writing and reading. Creates/overwrites file.</td></tr>
                                    <tr><td class="font-bold text-[#2979FF]">"a+"</td><td>Append and Read</td><td>Opens for appending and reading. Creates file if it doesn't exist.</td></tr>
                                    <tr><td class="font-bold text-[#C0392B]">"b"</td><td>Binary mode</td><td>Used with other modes (e.g., "rb", "wb") for binary files.</td></tr>

        }, {
            // Slide 4 - Reading Files - Basic
            content: () => `
                    <div class="glass-card-oop rounded-3xl p-8 md:p-10">
                        <h2 class="text-3xl md:text-4xl font-bold text-[#6A0DAD] mb-4">2. Reading Files</h2>
                        <p class="font-bold text-[#6A0DAD] text-lg">Basic File Reading</p>
                        ${makeCodeBlock(`# Reading entire file as a string
with open("example.txt", "r") as file:
    content = file.read()
    print(content)

# Reading line by line
with open("example.txt", "r") as file:
    for line in file:
        print(line.strip())  # strip() removes trailing newline

# Reading into a list of lines
with open("example.txt", "r") as file:
    lines = file.readlines()
    print(lines)`)}

                                <li><span class="font-bold">.readlines()</span> returns a list of all lines</li>

                    </div>
                `

            // Slide 5 - Reading Files - Advanced
            content: () => `
                    <div class="glass-card-oop rounded-3xl p-8 md:p-10">
                        <h2 class="text-3xl md:text-4xl font-bold text-[#6A0DAD] mb-4">Reading Files — Advanced Techniques</h2>
                        ${makeCodeBlock(`# Reading a specific number of characters
with open("example.txt", "r") as file:
    first_10 = file.read(10)
    print(f"First 10 chars: {first_10}")

# Reading line by line with while loop
with open("example.txt", "r") as file:
    while True:
        line = file.readline()
        if not line:
            break
        print(line.strip())

# Using seek() to move file pointer
with open("example.txt", "r") as file:
    file.seek(10)  # Move to position 10
    content = file.read(20)
    print(content)
    print(f"Current position: {file.tell()}")`)}
                    </div>
                `
        }, {
            // Slide 6 - Writing Files
            content: () => `
                    <div class="glass-card-oop rounded-3xl p-8 md:p-10">
                        <h2 class="text-3xl md:text-4xl font-bold text-[#6A0DAD] mb-4">3. Writing Files</h2>
                        ${makeCodeBlock(`# Writing (overwrites existing content)
with open("example.txt", "w") as file:
    file.write("Hello, World!\\n")
    file.write("This is a new line.\\n")

# Appending (adds to existing content)
with open("example.txt", "a") as file:
    file.write("This line is appended.\\n")

# Writing multiple lines from a list
lines = ["Line 1\\n", "Line 2\\n", "Line 3\\n"]
with open("example.txt", "w") as file:
    file.writelines(lines)

# Using print() to write to file
with open("example.txt", "w") as file:
    print("This goes to the file", file=file)
    print("Another line", file=file)`)}
                        <div class="warning-box p-2 rounded-lg mt-3">
                            <p class="font-bold text-[#C0392B] text-sm">⚠️ Warning:</p>
                            <p class="text-xs text-dark-secondary">"w" mode <span class="font-bold">erases the file first</span> — use carefully! Use "a" if you want to preserve existing content.</p>
                        </div>
                    </div>
                `
        }, {
            // Slide 7 - CSV File Handling
            content: () => `
                    <div class="glass-card-oop rounded-3xl p-8 md:p-10">
                        <h2 class="text-3xl md:text-4xl font-bold text-[#6A0DAD] mb-4">CSV File Handling</h2>
                        ${makeCodeBlock(`import csv

# Reading a CSV file
with open("data.csv", "r") as file:
    reader = csv.reader(file)
    for row in reader:
        print(row)

# Reading with headers
with open("data.csv", "r") as file:
    reader = csv.DictReader(file)
    for row in reader:
        print(row["Name"], row["Age"])

# Writing a CSV file
with open("output.csv", "w", newline="") as file:
    writer = csv.writer(file)
    writer.writerow(["Name", "Age", "Course"])
    writer.writerow(["John", 20, "Computer Science"])
    writer.writerow(["Mary", 22, "Mathematics"])

# Writing with headers
with open("output.csv", "w", newline="") as file:
    fieldnames = ["Name", "Age", "Course"]
    writer = csv.DictWriter(file, fieldnames=fieldnames)
    writer.writeheader()
    writer.writerow({"Name": "John", "Age": 20, "Course": "Computer Science"})`)}

                `

                    <div class="glass-card-oop rounded-3xl p-8 md:p-10">

                        ${makeCodeBlock(`import json

# Writing JSON data
data = {
    "name": "John",
    "age": 20,
    "course": "Computer Science",
    "grades": [85, 90, 78]
}

with open("data.json", "w") as file:
    json.dump(data, file, indent=4)

# Reading JSON data
with open("data.json", "r") as file:
    loaded_data = json.load(file)
    print(loaded_data["name"])
    print(loaded_data["grades"])

# Pretty printing JSON
json_string = json.dumps(data, indent=2)
print(json_string)`)}

                            <ul class="bulleted-list text-xs text-dark-secondary">

                                <li><span class="font-bold">json.load()</span> reads from a file</li>

                                <li><span class="font-bold">indent</span> makes the output readable</li>
                            </ul>
                        </div>
                    </div>
                `
        }, {
            // Slide 9 - Working with Binary Files
            content: () => `
                    <div class="glass-card-oop rounded-3xl p-8 md:p-10">
                        <h2 class="text-3xl md:text-4xl font-bold text-[#6A0DAD] mb-4">Working with Binary Files</h2>
                        ${makeCodeBlock(`# Reading a binary file
with open("image.jpg", "rb") as file:
    data = file.read()
    print(f"Read {len(data)} bytes")

# Writing a binary file
with open("copy.jpg", "wb") as file:
    file.write(data)

# Copying a binary file
with open("image.jpg", "rb") as source:
    with open("copy.jpg", "wb") as destination:
        for chunk in iter(lambda: source.read(4096), b''):
            destination.write(chunk)
        print("File copied successfully")`)}

                                <li><span class="font-bold">"rb"</span> mode for reading binary files</li>

# Check if file exists
if os.path.exists("example.txt"):

    print("It's a file")

if os.path.isdir("my_folder"):
    print("It's a directory")

# Get file size
size = os.path.getsize("example.txt")
print(f"File size: {size} bytes")

# Check file permissions (Unix/Linux)
if os.access("example.txt", os.R_OK):
    print("File is readable")
if os.access("example.txt", os.W_OK):

import shutil

# Rename a file
os.rename("old_name.txt", "new_name.txt")

# Delete a file

# Remove an empty directory

    age = int(input("Enter age: "))
except ValueError:
    print("Invalid input — age must be a number.")
except Exception as e:
    print(f"Unexpected error: {e}")
else:

        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const slideCounterSpan = document.getElementById('slideCounter');
        const progressFill = document.getElementById('progressFill');

        function renderSlide() {
            if (!slidesWrapper) return;
            slidesWrapper.style.opacity = '0';
            slidesWrapper.style.transform = 'rotateY(15deg) translateZ(-20px)';
            setTimeout(() => {
                slidesWrapper.innerHTML =
                    `<div class="slide-card w-full transition-all duration-700">${slidesData[currentIndex].content()}</div>`;
                slidesWrapper.style.opacity = '1';
                slidesWrapper.style.transform = 'rotateY(0deg) translateZ(0px)';
                slideCounterSpan.innerText = `${currentIndex+1} / ${slidesData.length}`;
                progressFill.style.width = `${((currentIndex + 1) / slidesData.length) * 100}%`;
                if (slideContainer) slideContainer.scrollTop = 0;
            }, 150);
        }

        function nextSlide() {
            if (currentIndex < slidesData.length - 1) { currentIndex++;
                renderSlide(); }
        }

        function prevSlide() {
            if (currentIndex > 0) { currentIndex--;
                renderSlide(); }
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextSlide();
            if (e.key === 'ArrowLeft') prevSlide();
        });
        let touchStartX = 0;
        document.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].screenX; });
        document.addEventListener('touchend', (e) => {
            let endX = e.changedTouches[0].screenX;
            if (endX < touchStartX - 50) nextSlide();
            if (endX > touchStartX + 50) prevSlide();
        });
        prevBtn?.addEventListener('click', prevSlide);
        nextBtn?.addEventListener('click', nextSlide);

        renderSlide();
