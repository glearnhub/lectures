<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>STA 201 | Probability & Statistics I | Africa International University</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PptxGenJS for PPTX generation -->
    <script src="https://cdn.jsdelivr.net/gh/gitbrent/PptxGenJS@3.12.0/dist/pptxgen.bundle.js"></script>
    <style>
        /* AIU Red theme: #C8102E (primary red) */
        .aiu-red { color: #C8102E; }
        .aiu-red-bg { background: #C8102E; }
        .aiu-border-red { border-color: #C8102E; }

        .glass-card-aiu {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(200, 16, 46, 0.25);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08), 0 0 20px rgba(200, 16, 46, 0.06);
        }

        .red-glow {
            text-shadow: 0 0 20px rgba(200, 16, 46, 0.15), 0 0 40px rgba(200, 16, 46, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: radial-gradient(circle at 20% 30%, #f5f5f5, #e8e8e8);
            overflow: hidden;
            height: 100vh;
        }

        .slide-container {
            perspective: 1200px;
            transform-style: preserve-3d;
            height: 100%;
            width: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        .slide-container::-webkit-scrollbar {
            width: 6px;
        }
        .slide-container::-webkit-scrollbar-track {
            background: rgba(200, 16, 46, 0.08);
            border-radius: 10px;
        }
        .slide-container::-webkit-scrollbar-thumb {
            background: #C8102E;
            border-radius: 10px;
        }

        .slide-card {
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            transform-style: preserve-3d;
            backface-visibility: hidden;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .grid-particles {
            background-image:
                linear-gradient(rgba(200, 16, 46, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(200, 16, 46, 0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: shiftGrid 20s linear infinite;
        }

        @keyframes shiftGrid {
            0% { background-position: 0 0; }
            100% { background-position: 40px 40px; }
        }

        .progress-fill {
            transition: width 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #f0f0f0;
        }
        ::-webkit-scrollbar-thumb {
            background: #C8102E;
            border-radius: 4px;
        }

        .bulleted-list {
            list-style-type: disc;
            padding-left: 1.5rem;
            margin: 0.75rem 0;
        }
        .bulleted-list li {
            margin: 0.45rem 0;
            line-height: 1.5;
        }
        .numbered-list {
            list-style-type: decimal;
            padding-left: 1.5rem;
            margin: 0.75rem 0;
        }
        .numbered-list li {
            margin: 0.45rem 0;
            line-height: 1.5;
        }

        .comparison-table th {
            background: rgba(200, 16, 46, 0.08);
        }
        .comparison-table td,
        .comparison-table th {
            padding: 0.5rem;
            border: 1px solid rgba(200, 16, 46, 0.12);
        }

        .kenya-box {
            background: rgba(200, 16, 46, 0.06);
            border-left: 4px solid #C8102E;
        }

        .tip-box {
            background: rgba(200, 16, 46, 0.05);
            border-left: 4px solid #C8102E;
        }

        .noir-memory {
            background: linear-gradient(135deg, #fef0f0, #fce8e8);
            border: 1px solid #C8102E;
        }

        .download-btn {
            transition: all 0.3s ease;
            background: #C8102E;
            color: white;
            padding: 12px 30px;
            border-radius: 30px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(200, 16, 46, 0.3);
        }
        .download-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(200, 16, 46, 0.4);
            background: #A00D25;
        }
        .download-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .text-dark { color: #1a1a2e; }
        .text-dark-secondary { color: #333333; }
        .text-dark-muted { color: #555555; }
        .text-dark-light { color: #777777; }
        .bg-white-soft { background: #fafafa; }
        .border-light { border-color: rgba(200, 16, 46, 0.15); }

        /* Table styling for slides */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        .data-table th {
            background: rgba(200, 16, 46, 0.08);
            color: #1a1a2e;
            font-weight: 600;
            padding: 0.5rem;
            border: 1px solid rgba(200, 16, 46, 0.15);
            text-align: left;
        }
        .data-table td {
            padding: 0.5rem;
            border: 1px solid rgba(200, 16, 46, 0.12);
            color: #333333;
        }
        .data-table tr:nth-child(even) {
            background: rgba(200, 16, 46, 0.03);
        }
        .data-table .highlight {
            color: #C8102E;
            font-weight: 600;
        }
    </style>
</head>
<body class="text-dark overflow-hidden h-screen w-screen">

    <div class="relative h-full w-full overflow-hidden">
        <div class="absolute inset-0 grid-particles opacity-60 pointer-events-none"></div>
        <div class="absolute inset-0 bg-gradient-to-br from-white via-red-50/30 to-white pointer-events-none"></div>

        <div class="absolute top-20 left-10 w-64 h-64 bg-[#C8102E]/5 rounded-full blur-3xl animate-pulse-slow pointer-events-none"></div>
        <div class="absolute bottom-20 right-10 w-80 h-80 bg-[#C8102E]/8 rounded-full blur-3xl animate-pulse-slow delay-1000 pointer-events-none"></div>

        <div class="relative z-10 flex flex-col h-full w-full">
            <!-- Top Bar -->
            <div class="fixed top-0 left-0 right-0 p-4 md:p-6 z-30 bg-gradient-to-b from-white/95 to-white/80 backdrop-blur-md border-b border-[#C8102E]/10">
                <div class="flex justify-between items-center mb-2">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-[#C8102E] flex items-center justify-center text-white font-bold text-lg">AIU</div>
                        <div class="hidden md:block">
                            <p class="text-xs text-[#C8102E] font-bold tracking-wider">AFRICA INTERNATIONAL UNIVERSITY</p>
                            <p class="text-[10px] text-dark-muted">STA 201 — Probability & Statistics I</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <span id="slideCounter" class="text-sm font-mono bg-white/80 px-3 py-1 rounded-full border border-[#C8102E]/30 backdrop-blur text-dark">1 / 24</span>
                        <button id="prevBtn" class="p-2 rounded-full bg-white/80 backdrop-blur border border-[#C8102E]/30 hover:bg-[#C8102E]/10 transition-all duration-300 transform hover:scale-110">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C8102E" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
                        </button>
                        <button id="nextBtn" class="p-2 rounded-full bg-white/80 backdrop-blur border border-[#C8102E]/30 hover:bg-[#C8102E]/10 transition-all duration-300 transform hover:scale-110">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C8102E" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
                        </button>
                    </div>
                </div>
                <div class="w-full h-1.5 bg-gray-200 rounded-full overflow-hidden">
                    <div id="progressFill" class="progress-fill h-full bg-[#C8102E] rounded-full" style="width: 4.2%"></div>
                </div>
                <p class="text-[10px] text-[#C8102E]/60 text-center mt-2 font-mono tracking-wider">✦ STA 201 — INTRODUCTION TO STATISTICS & DATA COLLECTION ✦</p>
            </div>

            <!-- Slide Content Area -->
            <div id="slideContainer" class="flex-1 slide-container mt-24 mb-4 px-4">
                <div id="slidesWrapper" class="w-full max-w-6xl mx-auto transition-all duration-700" style="transform-style: preserve-3d;"></div>
            </div>

            <div class="fixed bottom-3 left-1/2 transform -translate-x-1/2 z-30 text-[#C8102E]/40 text-[10px] font-mono bg-white/80 px-3 py-1 rounded-full backdrop-blur-sm border border-[#C8102E]/10">
                ↑↓ Scroll • ← → Navigate slides
            </div>
        </div>
    </div>

    <script>
        // =============================================================
        // STA 201: PROBABILITY & STATISTICS I - WEEK 1
        // Complete 24-slide presentation with all content from notes
        // Including all tables, examples, and case studies
        // PPTX download using PptxGenJS
        // White background with appropriate text colors
        // =============================================================

        function downloadPPTX() {
            const btn = document.querySelector('.download-btn');
            btn.disabled = true;
            btn.textContent = '⏳ Generating PPTX...';

            try {
                const pptx = new PptxGenJS();
                pptx.defineLayout({ name: 'WIDE', width: 13.33, height: 7.5 });
                pptx.layout = 'WIDE';

                const RED = 'C8102E';
                const WHITE = 'FFFFFF';
                const DARK = '1A1A2E';
                const LIGHT_GRAY = 'F5F5F5';
                const MEDIUM_GRAY = '666666';

                function addSlideWithHeader(titleText) {
                    const slide = pptx.addSlide();
                    slide.background = { color: WHITE };
                    slide.addShape(pptx.ShapeType.rect, { x: 0, y: 0, w: 13.33, h: 0.7, fill: { color: RED } });
                    slide.addText('AIU', { x: 0.3, y: 0.05, w: 0.8, h: 0.6, fontSize: 16, color: WHITE, fontFace: 'Arial', bold: true, valign: 'middle' });
                    slide.addText('AFRICA INTERNATIONAL UNIVERSITY', { x: 1.2, y: 0.05, w: 4.5, h: 0.6, fontSize: 11, color: WHITE, fontFace: 'Arial', bold: true, valign: 'middle' });
                    slide.addText('STA 201 — Probability & Statistics I', { x: 9.5, y: 0.05, w: 3.5, h: 0.6, fontSize: 10, color: WHITE, fontFace: 'Arial', align: 'right', valign: 'middle' });
                    slide.addText(titleText, { x: 0.5, y: 1.0, w: 12.33, h: 0.7, fontSize: 26, color: RED, fontFace: 'Arial', bold: true, valign: 'middle' });
                    slide.addShape(pptx.ShapeType.rect, { x: 0.5, y: 1.8, w: 12.33, h: 0.04, fill: { color: RED } });
                    return slide;
                }

                function addBulletPoints(slide, items, yStart) {
                    let yPos = yStart;
                    items.forEach(item => {
                        slide.addText(item, { x: 1.0, y: yPos, w: 11.0, h: 0.45, fontSize: 15, color: DARK, fontFace: 'Arial', valign: 'middle', bullet: true });
                        yPos += 0.5;
                    });
                    return yPos;
                }

                function addNumberedList(slide, items, yStart) {
                    let yPos = yStart;
                    items.forEach((item, idx) => {
                        slide.addText(`${idx+1}. ${item}`, { x: 1.0, y: yPos, w: 11.0, h: 0.45, fontSize: 14, color: DARK, fontFace: 'Arial', valign: 'middle' });
                        yPos += 0.48;
                    });
                    return yPos;
                }

                // ===== SLIDE 1: TITLE =====
                let slide = pptx.addSlide();
                slide.background = { color: WHITE };
                slide.addShape(pptx.ShapeType.rect, { x: 0, y: 0, w: 13.33, h: 0.7, fill: { color: RED } });
                slide.addText('AIU', { x: 0.3, y: 0.05, w: 0.8, h: 0.6, fontSize: 16, color: WHITE, fontFace: 'Arial', bold: true, valign: 'middle' });
                slide.addText('AFRICA INTERNATIONAL UNIVERSITY', { x: 1.2, y: 0.05, w: 4.5, h: 0.6, fontSize: 11, color: WHITE, fontFace: 'Arial', bold: true, valign: 'middle' });
                slide.addText('STA 201 — Probability & Statistics I', { x: 9.5, y: 0.05, w: 3.5, h: 0.6, fontSize: 10, color: WHITE, fontFace: 'Arial', align: 'right', valign: 'middle' });

                slide.addShape(pptx.ShapeType.ellipse, { x: 5.8, y: 1.2, w: 1.8, h: 1.8, fill: { color: RED } });
                slide.addText('AIU', { x: 5.8, y: 1.4, w: 1.8, h: 1.4, fontSize: 32, color: WHITE, fontFace: 'Arial', bold: true, align: 'center', valign: 'middle' });
                slide.addText('STA 201 — Probability & Statistics I', { x: 0.5, y: 3.3, w: 12.33, h: 0.8, fontSize: 34, color: DARK, fontFace: 'Arial', bold: true, align: 'center', valign: 'middle', shadow: { type: 'outer', color: RED, blur: 8, offset: 1 } });
                slide.addShape(pptx.ShapeType.rect, { x: 5.8, y: 4.2, w: 1.8, h: 0.06, fill: { color: RED } });
                slide.addText('Week 1: Introduction to Statistics & Data Collection', { x: 0.5, y: 4.4, w: 12.33, h: 0.7, fontSize: 20, color: RED, fontFace: 'Arial', bold: true, align: 'center', valign: 'middle' });
                slide.addText('Department of Mathematics · Undergraduate Programme · 3 Credit Hours', { x: 0.5, y: 5.4, w: 12.33, h: 0.5, fontSize: 13, color: MEDIUM_GRAY, fontFace: 'Arial', align: 'center', valign: 'middle' });

                // ===== SLIDE 2: LEARNING OBJECTIVES =====
                slide = addSlideWithHeader('Learning Objectives');
                const objectives = [
                    'Define statistics and explain its role in research, policy, and professional practice.',
                    'Distinguish between descriptive and inferential statistics.',
                    'Classify variables by type: nominal, ordinal, interval, and ratio.',
                    'Identify the population and sample in a given study.',
                    'Differentiate between a census and a sample survey, with their trade-offs.',
                    'Describe and apply at least four sampling techniques.',
                    'Evaluate the appropriateness of a sampling method for a given Kenyan context.'
                ];
                slide.addText('By the end of this topic, you should be able to:', { x: 0.5, y: 2.2, w: 12.33, h: 0.5, fontSize: 17, color: DARK, fontFace: 'Arial', valign: 'middle' });
                addBulletPoints(slide, objectives, 2.8);

                // ===== SLIDE 3: WHAT IS STATISTICS? =====
                slide = addSlideWithHeader('1. What is Statistics?');
                slide.addText('Statistics is the science of collecting, organising, summarising, analysing, and interpreting data in order to draw conclusions and make decisions in the presence of uncertainty.', { x: 0.5, y: 2.2, w: 12.33, h: 1.0, fontSize: 16, color: DARK, fontFace: 'Arial', valign: 'middle' });
                slide.addShape(pptx.ShapeType.rect, { x: 0.5, y: 3.4, w: 0.08, h: 0.8, fill: { color: RED } });
                slide.addText('Etymology: The word statistics comes from the Latin "statisticum collegium" (council of state) and the Italian "statista" (statesman). Governments have collected data on populations, land, and wealth for thousands of years.', { x: 0.8, y: 3.4, w: 11.5, h: 0.8, fontSize: 13, color: MEDIUM_GRAY, fontFace: 'Arial', valign: 'middle' });

                // ===== SLIDE 4: TWO MAIN BRANCHES OF STATISTICS =====
                slide = addSlideWithHeader('1.1 Two Main Branches of Statistics');
                slide.addText('Descriptive Statistics', { x: 0.8, y: 2.2, w: 5.5, h: 0.5, fontSize: 18, color: RED, fontFace: 'Arial', bold: true });
                slide.addText('Organises, summarises, and presents data in a meaningful way — using numbers, tables, and graphs. Answers: What does the data show?', { x: 1.0, y: 2.8, w: 5.0, h: 0.8, fontSize: 14, color: DARK, fontFace: 'Arial' });
                addBulletPoints(slide, ['Average monthly income across 47 counties (KNBS 2019)', 'Bar chart of university enrolment by gender', 'Percentage of households with electricity in Turkana'], 3.7);

                slide.addText('Inferential Statistics', { x: 6.8, y: 2.2, w: 5.5, h: 0.5, fontSize: 18, color: RED, fontFace: 'Arial', bold: true });
                slide.addText('Uses data from a sample to make estimates, predictions, or decisions about a larger population. Answers: What can we conclude beyond this data?', { x: 7.0, y: 2.8, w: 5.0, h: 0.8, fontSize: 14, color: DARK, fontFace: 'Arial' });
                addBulletPoints(slide, ['Estimating the average income of all Kenyans from a sample', 'Testing whether a new malaria drug reduces mortality', 'Predicting Kenya\'s 2030 population from census trends'], 3.7);

                // ===== SLIDE 5: WHY STATISTICS MATTERS IN KENYA =====
                slide = addSlideWithHeader('1.2 Why Statistics Matters in Kenya');
                slide.addText('Statistics underpins decision-making at every level — from village-level water projects to national development planning.', { x: 0.5, y: 2.2, w: 12.33, h: 0.5, fontSize: 15, color: DARK, fontFace: 'Arial' });

                const kenyaData = [
                    ['Institution / Context', 'How Statistics Is Used'],
                    ['Kenya National Bureau of Statistics (KNBS)', 'Produces the national census, GDP estimates, CPI, and the Statistical Abstract'],
                    ['Central Bank of Kenya (CBK)', 'Uses statistical models to set the benchmark interest rate, track inflation'],
                    ['Ministry of Health / NASCOP', 'Uses surveillance data to track HIV/AIDS, TB, and malaria prevalence'],
                    ['Independent Electoral & Boundaries Commission (IEBC)', 'Uses population statistics to delimit constituency boundaries'],
                    ['Safaricom / Telecoms', 'Analyses transaction data to detect fraud, predict churn, and price services'],
                    ['Agricultural sector (KTDA, NCPB)', 'Uses yield statistics and weather data to forecast harvests']
                ];
                let yPos = 2.9;
                kenyaData.forEach((row, idx) => {
                    const isHeader = idx === 0;
                    slide.addText(row[0], { x: 0.8, y: yPos, w: 4.5, h: 0.4, fontSize: isHeader ? 13 : 12, color: isHeader ? RED : DARK, fontFace: 'Arial', bold: isHeader });
                    slide.addText(row[1], { x: 5.5, y: yPos, w: 6.5, h: 0.4, fontSize: isHeader ? 13 : 12, color: isHeader ? RED : DARK, fontFace: 'Arial', bold: isHeader });
                    yPos += 0.45;
                });

                // ===== SLIDE 6: POPULATION AND SAMPLE =====
                slide = addSlideWithHeader('2.1 Population and Sample');
                slide.addText('Population: The complete set of all individuals, objects, measurements, or events that share a characteristic of interest.', { x: 0.8, y: 2.2, w: 11.5, h: 0.6, fontSize: 15, color: DARK, fontFace: 'Arial', valign: 'middle' });
                slide.addShape(pptx.ShapeType.rect, { x: 0.5, y: 2.2, w: 0.08, h: 0.6, fill: { color: RED } });
                slide.addText('Sample: A subset of the population actually selected for study. Used to make inferences about the population.', { x: 0.8, y: 2.9, w: 11.5, h: 0.6, fontSize: 15, color: DARK, fontFace: 'Arial', valign: 'middle' });
                slide.addShape(pptx.ShapeType.rect, { x: 0.5, y: 2.9, w: 0.08, h: 0.6, fill: { color: RED } });
                slide.addText('Parameter: A numerical summary computed from the entire population. Usually unknown and estimated from the sample.', { x: 0.8, y: 3.6, w: 11.5, h: 0.6, fontSize: 15, color: DARK, fontFace: 'Arial', valign: 'middle' });
                slide.addShape(pptx.ShapeType.rect, { x: 0.5, y: 3.6, w: 0.08, h: 0.6, fill: { color: RED } });
                slide.addText('Statistic: A numerical summary computed from the sample. Used to estimate a population parameter.', { x: 0.8, y: 4.3, w: 11.5, h: 0.6, fontSize: 15, color: DARK, fontFace: 'Arial', valign: 'middle' });
                slide.addShape(pptx.ShapeType.rect, { x: 0.5, y: 4.3, w: 0.08, h: 0.6, fill: { color: RED } });

                slide.addShape(pptx.ShapeType.rect, { x: 0.5, y: 5.1, w: 12.33, h: 0.04, fill: { color: RED } });
                slide.addText('Example: Average maize yield in Uasin Gishu — Population: All 120,000 farmers | Sample: 400 farmers | Parameter: True mean (unknown) | Statistic: x̄ = 17.9 bags/acre', { x: 0.8, y: 5.2, w: 11.5, h: 0.8, fontSize: 12, color: MEDIUM_GRAY, fontFace: 'Arial' });

                // ===== SLIDE 7: VARIABLES AND DATA =====
                slide = addSlideWithHeader('2.2 Variables and Data');
                slide.addText('A variable is any characteristic, number, or quantity that can be measured or counted across different members of a population.', { x: 0.5, y: 2.2, w: 12.33, h: 0.6, fontSize: 16, color: DARK, fontFace: 'Arial' });
                slide.addText('Quantitative (Numerical)', { x: 0.8, y: 3.0, w: 5.5, h: 0.5, fontSize: 18, color: RED, fontFace: 'Arial', bold: true });
                slide.addText('Discrete: Countable values. E.g. number of children, number of matatus.', { x: 1.0, y: 3.5, w: 5.0, h: 0.5, fontSize: 14, color: DARK, fontFace: 'Arial' });
                slide.addText('Continuous: Any value in an interval. E.g. height, rainfall in mm.', { x: 1.0, y: 4.0, w: 5.0, h: 0.5, fontSize: 14, color: DARK, fontFace: 'Arial' });
                slide.addText('Qualitative (Categorical)', { x: 6.8, y: 3.0, w: 5.5, h: 0.5, fontSize: 18, color: RED, fontFace: 'Arial', bold: true });
                slide.addText('Takes category labels (no natural arithmetic). E.g. county of residence, type of crop grown, method of payment.', { x: 7.0, y: 3.5, w: 5.0, h: 1.0, fontSize: 14, color: DARK, fontFace: 'Arial' });

                // ===== SLIDE 8: LEVELS OF MEASUREMENT (NOIR) =====
                slide = addSlideWithHeader('3. Levels of Measurement (Types of Data)');
                slide.addShape(pptx.ShapeType.rect, { x: 3.5, y: 2.1, w: 6.33, h: 0.6, fill: { color: '#fef0f0' }, line: { color: RED, width: 1 } });
                slide.addText('N → O → I → R', { x: 3.5, y: 2.1, w: 6.33, h: 0.6, fontSize: 26, color: RED, fontFace: 'Arial', bold: true, align: 'center', valign: 'middle' });
                slide.addText('Nominal · Ordinal · Interval · Ratio', { x: 0.5, y: 2.8, w: 12.33, h: 0.4, fontSize: 16, color: DARK, fontFace: 'Arial', align: 'center' });
                slide.addText('Each level adds one property to the previous level.', { x: 0.5, y: 3.2, w: 12.33, h: 0.3, fontSize: 12, color: MEDIUM_GRAY, fontFace: 'Arial', align: 'center' });

                const noirData = [
                    ['Level', 'Description', 'Properties', 'Kenyan Example'],
                    ['Nominal', 'Categories with no inherent order', 'Identity only', 'County of birth, mobile network'],
                    ['Ordinal', 'Categories with a meaningful order', 'Identity + Rank', 'KCSE grade, customer satisfaction'],
                    ['Interval', 'Numerical with equal intervals, no true zero', 'Identity + Rank + Equal intervals', 'Temperature in °C, year of birth'],
                    ['Ratio', 'Numerical with equal intervals AND true zero', 'All of the above + True zero', 'Income in Ksh, age, weight, distance']
                ];
                let yPos2 = 3.6;
                noirData.forEach((row, idx) => {
                    const isHeader = idx === 0;

            slidesWrapper.style.transform = 'rotateY(15deg) translateZ(-20px)';
            setTimeout(() => {
                slidesWrapper.innerHTML =

                if (slideContainer) slideContainer.scrollTop = 0;
            }, 150);
        }

        function nextSlide() {
            if (currentIndex < slidesData.length - 1) { currentIndex++;
                renderSlide(); }
        }

        function prevSlide() {
            if (currentIndex > 0) { currentIndex--;
                renderSlide(); }
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextSlide();
            if (e.key === 'ArrowLeft') prevSlide();
        });
        let touchStartX = 0;
        document.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].screenX; });

            let endX = e.changedTouches[0].screenX;
            if (endX < touchStartX - 50) nextSlide();
            if (endX > touchStartX + 50) prevSlide();
        });
        prevBtn?.addEventListener('click', prevSlide);
        nextBtn?.addEventListener('click', nextSlide);
