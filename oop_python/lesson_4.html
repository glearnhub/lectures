            0% { background-position: 0 0; }

        .progress-fill {
            transition: width 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);

            margin: 0.75rem 0;

            font-size: 13px;
            overflow-x: auto;

            background: rgba(200, 16, 46, 0.06);

            border: 1px solid rgba(200, 16, 46, 0.12);

</head>

            return `
                <div class="relative">
                    <div class="code-block p-3 rounded-lg overflow-x-auto">
                        <pre class="text-sm font-mono text-green-300 whitespace-pre-wrap">${escapedCode}</pre>
                    </div>
                    <button onclick="navigator.clipboard.writeText(\`${code.replace(/`/g, '\\`').replace(/\\/g, '\\\\')}\`)" 
                        class="copy-btn absolute top-2 right-2 bg-gray-800/80 hover:bg-[#C8102E]/50 text-white text-xs px-2 py-1 rounded transition-all">
                        📋 Copy
                    </button>
                </div>
            `;
        }

                            <p class="text-sm text-dark-secondary"><span class="text-[#C8102E] font-bold">Problem:</span> This works, but it's clunky — we have to manually set attributes after creating the object every time. This week we fix that with <span class="text-[#C8102E] font-bold">constructors</span>.</p>

            content: () => `
                    <div class="glass-card-aiu rounded-3xl p-8 md:p-10">
                        <h2 class="text-3xl md:text-4xl font-bold text-[#C8102E] mb-4">2. The __init__() Constructor</h2>
                        <p class="text-dark-secondary">The <span class="text-[#C8102E] font-bold">__init__()</span> method is a special method that runs automatically whenever you create a new object. It's used to set up (initialize) the object's starting data.</p>
                        ${makeCodeBlock(`class Student:
    def __init__(self, student_id, name, age):
        self.student_id = student_id
        self.name = name
        self.age = age`)}
                        <div class="space-y-2 mt-4">
                            <div class="p-2 bg-[#C8102E]/5 rounded-lg border-l-4 border-[#C8102E]"><span class="font-bold text-[#C8102E]">Key points:</span></div>

                            <div class="p-2 bg-white/5 rounded-lg"><span class="text-[#C8102E]">•</span> <span class="font-bold">self</span> refers to the specific object being created. It must always be the first parameter.</div>
                            <div class="p-2 bg-white/5 rounded-lg"><span class="text-[#C8102E]">•</span> <span class="font-bold">self.name = name</span> means: "store the value passed in as name, onto this object, as an attribute called name."</div>
                        </div>
                        ${makeCodeBlock(`# Now creating a student is one line!

        self.age = age

                        <h2 class="text-3xl md:text-4xl font-bold text-[#C8102E] mb-4">5. Parameters and Return Values</h2>

                        ${makeCodeBlock(`class Student:
    def __init__(self, student_id, name, age):
        self.student_id = student_id
        self.name = name
        self.age = age

    def update_age(self, new_age):

        return f"{self.name}'s age updated to {new_age}"

message = s1.update_age(21)

print(s1.is_adult())  # True`)}

                            <div class="p-2 bg-green-50/80 rounded-lg border border-green-200"><span class="font-bold text-green-700">print()</span><br><span class="text-sm text-dark-secondary">Just displays something — doesn't give the value back to your code.</span></div>

    def display_info(self):
        print(f"ID: {self.student_id} | Name: {self.name} | Age: {self.age}")
        if self.grades:
            print("Grades:", self.grades)`)}

        let currentIndex = 0;
        const slidesWrapper = document.getElementById('slidesWrapper');
        const slideContainer = document.getElementById('slideContainer');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const slideCounterSpan = document.getElementById('slideCounter');
        const progressFill = document.getElementById('progressFill');

        function renderSlide() {
            if (!slidesWrapper) return;
            slidesWrapper.style.opacity = '0';
            slidesWrapper.style.transform = 'rotateY(15deg) translateZ(-20px)';
            setTimeout(() => {
                slidesWrapper.innerHTML =
                    `<div class="slide-card w-full transition-all duration-700">${slidesData[currentIndex].content()}</div>`;
                slidesWrapper.style.opacity = '1';
                slidesWrapper.style.transform = 'rotateY(0deg) translateZ(0px)';
                slideCounterSpan.innerText = `${currentIndex+1} / ${slidesData.length}`;
                progressFill.style.width = `${((currentIndex + 1) / slidesData.length) * 100}%`;
                if (slideContainer) slideContainer.scrollTop = 0;
            }, 150);
        }

        function nextSlide() {
            if (currentIndex < slidesData.length - 1) { currentIndex++;
                renderSlide(); }
        }

        function prevSlide() {
            if (currentIndex > 0) { currentIndex--;
                renderSlide(); }
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextSlide();
            if (e.key === 'ArrowLeft') prevSlide();
        });
        let touchStartX = 0;
        document.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].screenX; });
        document.addEventListener('touchend', (e) => {
            let endX = e.changedTouches[0].screenX;
            if (endX < touchStartX - 50) nextSlide();
            if (endX > touchStartX + 50) prevSlide();
        });
        prevBtn?.addEventListener('click', prevSlide);
        nextBtn?.addEventListener('click', nextSlide);

        renderSlide();
    </script>
