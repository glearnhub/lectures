        .glass-card-ft {

        * {

            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: radial-gradient(circle at 20% 30%, #f5f5f5, #e8e8e8);
            overflow: hidden;
            height: 100vh;
        }

        .slide-container {
            perspective: 1200px;
            transform-style: preserve-3d;
            height: 100%;
            width: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        .slide-container::-webkit-scrollbar {
            width: 6px;
        }
        .slide-container::-webkit-scrollbar-track {
            background: rgba(106, 13, 173, 0.06);
            border-radius: 10px;
        }
        .slide-container::-webkit-scrollbar-thumb {
            background: #6A0DAD;
            border-radius: 10px;
        }

        .slide-card {
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            transform-style: preserve-3d;
            backface-visibility: hidden;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .grid-particles {
            background-image:
                linear-gradient(rgba(106, 13, 173, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(106, 13, 173, 0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: shiftGrid 20s linear infinite;
        }

        @keyframes shiftGrid {
            0% { background-position: 0 0; }
            100% { background-position: 40px 40px; }
        }

        .progress-fill {
            transition: width 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #f0f0f0;
        }
        ::-webkit-scrollbar-thumb {
            background: #6A0DAD;
            border-radius: 4px;
        }

        .bulleted-list {
            list-style-type: disc;
            padding-left: 1.5rem;
            margin: 0.75rem 0;
        }
        .bulleted-list li {
            margin: 0.45rem 0;
            line-height: 1.5;
        }
        .numbered-list {
            list-style-type: decimal;
            padding-left: 1.5rem;
            margin: 0.75rem 0;
        }
        .numbered-list li {
            margin: 0.45rem 0;
            line-height: 1.5;
        }

        .text-dark { color: #1A1A2E; }
        .text-dark-secondary { color: #333333; }
        .text-dark-muted { color: #555555; }

        .key-point {
            background: rgba(106, 13, 173, 0.06);
            border-left: 4px solid #6A0DAD;
            padding: 0.75rem;
            border-radius: 0.5rem;
        }

        .tip-box {
            background: rgba(39, 174, 96, 0.06);
            border-left: 4px solid #27AE60;
            padding: 0.75rem;
            border-radius: 0.5rem;
        }

        .comparison-table th {
            background: rgba(106, 13, 173, 0.06);
            color: #0D1B2A;
        }
        .comparison-table td,
        .comparison-table th {
            padding: 0.5rem;
            border: 1px solid rgba(106, 13, 173, 0.1);
            text-align: left;
        }
        .comparison-table td {
            color: #333333;
        }

        .threat-card {
            transition: all 0.2s ease;
            border: 1px solid rgba(13, 27, 42, 0.08);
        }
        .threat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        }

        .review-box {
            background: rgba(0, 180, 216, 0.06);
            border-left: 4px solid #00B4D8;
            padding: 0.75rem;
            border-radius: 0.5rem;
        }

        .dual-role {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .dual-role-item {
            background: rgba(106, 13, 173, 0.05);
            border: 1px solid #6A0DAD;
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
            min-width: 180px;
            flex: 1;
        }
        .dual-role-item.defense {
            border-color: #27AE60;
            background: rgba(39, 174, 96, 0.05);
        }
        .dual-role-item.attack {
            border-color: #C0392B;
            background: rgba(192, 57, 43, 0.05);
        }
    </style>
</head>

        const slidesWrapper = document.getElementById('slidesWrapper');
        const slideContainer = document.getElementById('slideContainer');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const slideCounterSpan = document.getElementById('slideCounter');
        const progressFill = document.getElementById('progressFill');

        function renderSlide() {
            if (!slidesWrapper) return;
            slidesWrapper.style.opacity = '0';
            slidesWrapper.style.transform = 'rotateY(15deg) translateZ(-20px)';
            setTimeout(() => {
                slidesWrapper.innerHTML =
                    `<div class="slide-card w-full transition-all duration-700">${slidesData[currentIndex].content()}</div>`;
                slidesWrapper.style.opacity = '1';
                slidesWrapper.style.transform = 'rotateY(0deg) translateZ(0px)';
                slideCounterSpan.innerText = `${currentIndex+1} / ${slidesData.length}`;
                progressFill.style.width = `${((currentIndex + 1) / slidesData.length) * 100}%`;
                if (slideContainer) slideContainer.scrollTop = 0;
            }, 150);
        }

        function nextSlide() {
            if (currentIndex < slidesData.length - 1) { currentIndex++;
                renderSlide(); }
        }

        function prevSlide() {
            if (currentIndex > 0) { currentIndex--;
                renderSlide(); }
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextSlide();
            if (e.key === 'ArrowLeft') prevSlide();
        });
        let touchStartX = 0;
        document.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].screenX; });
        document.addEventListener('touchend', (e) => {
            let endX = e.changedTouches[0].screenX;
            if (endX < touchStartX - 50) nextSlide();
            if (endX > touchStartX + 50) prevSlide();
        });
        prevBtn?.addEventListener('click', prevSlide);
        nextBtn?.addEventListener('click', nextSlide);

        renderSlide();
    </script>
