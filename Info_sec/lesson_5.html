    let currentIndex = 0;
    const slidesWrapper = document.getElementById('slidesWrapper');
    const slideContainer = document.getElementById('slideContainer');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const slideCounterSpan = document.getElementById('slideCounter');
    const progressFill = document.getElementById('progressFill');

    function renderSlide() {
        if (!slidesWrapper) return;
        slidesWrapper.style.opacity = '0';
        slidesWrapper.style.transform = 'rotateY(15deg) translateZ(-20px)';
        setTimeout(() => {
            slidesWrapper.innerHTML = `<div class="slide-card w-full transition-all duration-700">${slidesData[currentIndex].content()}</div>`;
            slidesWrapper.style.opacity = '1';
            slidesWrapper.style.transform = 'rotateY(0deg) translateZ(0px)';
            slideCounterSpan.innerText = `${currentIndex+1} / ${slidesData.length}`;
            progressFill.style.width = `${((currentIndex + 1) / slidesData.length) * 100}%`;
            if (slideContainer) slideContainer.scrollTop = 0;
        }, 150);
    }

    function nextSlide() { if (currentIndex < slidesData.length - 1) { currentIndex++; renderSlide(); } }
    function prevSlide() { if (currentIndex > 0) { currentIndex--; renderSlide(); } }

    window.addEventListener('keydown', (e) => { if (e.key === 'ArrowRight') nextSlide(); if (e.key === 'ArrowLeft') prevSlide(); });
    let touchStartX = 0;
    document.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].screenX; });
    document.addEventListener('touchend', (e) => { let endX = e.changedTouches[0].screenX; if (endX < touchStartX - 50) nextSlide(); if (endX > touchStartX + 50) prevSlide(); });
    prevBtn?.addEventListener('click', prevSlide);
    nextBtn?.addEventListener('click', nextSlide);
    
    renderSlide();
</script>
