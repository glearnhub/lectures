                    <p class="text-white/70 leading-relaxed">Network security refers to the set of policies, practices, and technologies designed to protect the integrity, confidentiality, and availability of computer networks and the data transmitted across them. It encompasses both hardware and software solutions aimed at preventing unauthorized access, misuse, modification, or denial of a network and its resources.</p>

                        <div class="p-2 bg-green-500/10 rounded"><span class="font-bold text-green-300">Transport Layer:</span> TLS/SSL encryption</div>
                        <div class="p-2 bg-yellow-500/10 rounded"><span class="font-bold text-yellow-300">Application Layer:</span> Web Application Firewalls (WAF), authentication protocols</div>
                    </div>

                        <p class="font-bold text-purple-300">Lecturer Tip:</p>

                    <div class="analogy-box p-3 rounded-lg mt-3">
                        <p class="font-bold text-cyan-300">Analogy:</p>
                        <p class="text-sm">Think of a firewall as a security guard at a building entrance. The guard checks IDs (packet headers) and decides who enters and who is turned away based on a list of approved people (security rules).</p>

            `

                        <div class="grid md:grid-cols-2 gap-2 mt-2">
                            <div class="p-2 bg-green-500/10 rounded"><span class="font-bold text-green-300">Advantage:</span> Low overhead, fast processing</div>
                            <div class="p-2 bg-red-500/10 rounded"><span class="font-bold text-red-300">Disadvantage:</span> Susceptible to IP spoofing; cannot detect sophisticated attacks</div>

    let currentIndex = 0;
    const slidesWrapper = document.getElementById('slidesWrapper');
    const slideContainer = document.getElementById('slideContainer');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const slideCounterSpan = document.getElementById('slideCounter');
    const progressFill = document.getElementById('progressFill');

    function renderSlide() {
        if (!slidesWrapper) return;
        slidesWrapper.style.opacity = '0';
        slidesWrapper.style.transform = 'rotateY(15deg) translateZ(-20px)';
        setTimeout(() => {
            slidesWrapper.innerHTML = `<div class="slide-card w-full transition-all duration-700">${slidesData[currentIndex].content()}</div>`;
            slidesWrapper.style.opacity = '1';
            slidesWrapper.style.transform = 'rotateY(0deg) translateZ(0px)';
            slideCounterSpan.innerText = `${currentIndex+1} / ${slidesData.length}`;
            progressFill.style.width = `${((currentIndex + 1) / slidesData.length) * 100}%`;
            if (slideContainer) slideContainer.scrollTop = 0;
        }, 150);
    }

    function nextSlide() { if (currentIndex < slidesData.length - 1) { currentIndex++; renderSlide(); } }
    function prevSlide() { if (currentIndex > 0) { currentIndex--; renderSlide(); } }

    window.addEventListener('keydown', (e) => { if (e.key === 'ArrowRight') nextSlide(); if (e.key === 'ArrowLeft') prevSlide(); });
    let touchStartX = 0;
    document.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].screenX; });
    document.addEventListener('touchend', (e) => { let endX = e.changedTouches[0].screenX; if (endX < touchStartX - 50) nextSlide(); if (endX > touchStartX + 50) prevSlide(); });
    prevBtn?.addEventListener('click', prevSlide);
    nextBtn?.addEventListener('click', nextSlide);
    
    renderSlide();
</script>
