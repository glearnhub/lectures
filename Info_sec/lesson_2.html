                        <p class="text-sm text-purple-300">🏦 Example: A bank's customer database is valuable because it contains financial information.</p>
                    </div>

            `

        { // Slide 4 - Hardware Assets (Detailed)
            content: () => `<div class="glass-card-deep rounded-3xl p-8 md:p-10"><h2 class="text-3xl font-bold text-cyan-300 mb-4">🖥️ 1. Hardware Assets</h2><p class="text-white/70 leading-relaxed">Hardware assets are the physical electronic devices and equipment used to collect, process, store, transmit, and secure information within an organization. These are tangible components of an information system that users can physically see and touch.</p><p class="text-white/70 mt-3">Hardware assets are important because they support daily business operations, communication, data storage, and access to information systems. Damage, theft, or failure of hardware assets can interrupt organizational activities and lead to data loss or security risks.</p><div class="flex flex-wrap gap-2 my-4"><span class="px-3 py-1 bg-blue-500/20 rounded-full">💻 Computers</span><span class="px-3 py-1 bg-blue-500/20 rounded-full">🗄️ Servers</span><span class="px-3 py-1 bg-blue-500/20 rounded-full">🖨️ Printers</span><span class="px-3 py-1 bg-blue-500/20 rounded-full">📡 Routers</span></div><div class="p-3 bg-cyan-900/30 rounded-lg"><p class="text-sm">🇰🇪 Example: Computers are used in business, for example, banks, schools, or even government offices like KRA.</p></div></div>`
        },
        { // Slide 5 - Software Assets (Detailed)
            content: () => `<div class="glass-card-deep rounded-3xl p-8 md:p-10"><h2 class="text-3xl font-bold text-cyan-300 mb-4">💿 2. Software Assets</h2><p class="text-white/70 leading-relaxed">Software assets are computer programs, applications, and operating systems used by an organization to perform tasks, manage data, and support business operations. Unlike hardware, software assets are intangible and cannot be physically touched.</p><p class="text-white/70 mt-3">Software assets enable users to interact with computer systems, process information, communicate, and automate organizational activities. Organizations must protect software assets from unauthorized access, piracy, malware, and system failures.</p><div class="flex flex-wrap gap-2 my-4"><span class="px-3 py-1 bg-green-500/20 rounded-full">💰 Payroll systems</span><span class="px-3 py-1 bg-green-500/20 rounded-full">📊 Accounting software</span><span class="px-3 py-1 bg-green-500/20 rounded-full">🏫 School management systems</span></div><div class="p-3 bg-purple-900/30 rounded-lg"><p class="text-sm">🇰🇪 Example: KRA iTax system software, Learning Management System.</p></div></div>`

        { // Slide 16 - Risk Assessment (5 Steps)
            content: () => `<div class="glass-card-deep rounded-3xl p-8 md:p-10"><h2 class="text-3xl font-bold text-cyan-300 mb-4">📋 Risk Assessment</h2><p class="text-white/70 mb-3"><span class="font-bold">What is Risk Assessment?</span> The process of identifying threats, identifying vulnerabilities and evaluating possible impacts.</p><div class="space-y-3"><div class="p-2 bg-white/5 rounded"><span class="text-cyan-400 font-bold">1. Identify assets</span> — Listing valuable information resources. <span class="text-purple-300 text-sm">Example: University student records.</span></div><div class="p-2 bg-white/5 rounded"><span class="text-cyan-400 font-bold">2. Identify threats</span> — Recognizing possible dangers. <span class="text-purple-300 text-sm">Example: Hacker attempting access.</span></div><div class="p-2 bg-white/5 rounded"><span class="text-cyan-400 font-bold">3. Identify vulnerabilities</span> — Finding weaknesses. <span class="text-purple-300 text-sm">Example: Weak student portal passwords.</span></div><div class="p-2 bg-white/5 rounded"><span class="text-cyan-400 font-bold">4. Determine impact</span> — Assessing damage. <span class="text-purple-300 text-sm">Example: Identity theft, loss of trust.</span></div><div class="p-2 bg-white/5 rounded"><span class="text-cyan-400 font-bold">5. Apply controls</span> — Implementing security measures. <span class="text-purple-300 text-sm">Example: Strong password policies and 2FA.</span></div></div></div>`
        },
        { // Slide 17 - Relationship Case Study (Kenyan College)
            content: () => `<div class="glass-card-deep rounded-3xl p-8 md:p-10"><h2 class="text-3xl font-bold text-cyan-300 mb-4">🔗 Threat + Vulnerability = Risk (Case Study)</h2><div class="p-4 bg-white/5 rounded-xl"><p class="font-bold">🏫 Kenyan College Scenario:</p><p class="text-sm text-white/70">A Nairobi college student portal was targeted by a hacker who tried to access student accounts using common passwords like "123456". Many students used weak passwords, and the system had no two-factor authentication. The attacker successfully accessed several accounts and viewed student personal information.</p></div><div class="grid md:grid-cols-3 gap-3 mt-4"><div class="p-3 bg-red-500/10 rounded-lg text-center"><span class="font-bold text-red-300">Threat</span><br>Hacker attempting unauthorized access</div><div class="p-3 bg-orange-500/10 rounded-lg text-center"><span class="font-bold text-orange-300">Vulnerability</span><br>Weak passwords, no 2FA</div><div class="p-3 bg-yellow-500/10 rounded-lg text-center"><span class="font-bold text-yellow-300">Risk</span><br>Exposure of student records, loss of privacy</div></div><div class="mt-4 p-3 bg-cyan-900/30 rounded-lg text-center"><p class="text-lg font-bold">Conclusion: A threat exploiting a vulnerability leads to risk.</p><p class="text-cyan-300 text-xl">Threat + Vulnerability = Risk</p></div></div>`
        },
        { // Slide 18 - Practice Assignment (Full Case Study)
            content: () => `<div class="glass-card-deep rounded-3xl p-8 md:p-10"><h2 class="text-3xl font-bold text-cyan-300 mb-4">📝 Practice Assignment</h2><div class="p-4 bg-white/5 rounded-xl"><p class="font-bold">🏛️ Case Study: Cyber Incident at a County Government Office</p><p class="text-sm text-white/70 mt-2">A county government office in Kenya introduced a new digital system for storing staff payroll and citizen service records. Employees were given login credentials, but many did not change their default passwords. Some staff also accessed the system using public Wi-Fi when working remotely.</p><p class="text-sm text-white/70 mt-2">One day, the system became slow and some records were found to have been altered. IT staff discovered that unauthorized users had gained access using stolen credentials from a phishing email sent to an employee. The incident led to delays in salary processing and loss of public trust.</p></div><div class="grid md:grid-cols-3 gap-4 mt-4 text-sm"><div class="p-3 bg-red-500/10 rounded-lg border border-red-500/30"><span class="font-bold text-red-300">Threats</span><br>• Hacker using stolen login credentials<br>• Phishing email sent to an employee</div><div class="p-3 bg-orange-500/10 rounded-lg border border-orange-500/30"><span class="font-bold text-orange-300">Vulnerabilities</span><br>• Weak default passwords not changed<br>• Staff using public Wi-Fi</div><div class="p-3 bg-yellow-500/10 rounded-lg border border-yellow-500/30"><span class="font-bold text-yellow-300">Risks</span><br>• Delay in salary processing<br>• Altered records, loss of trust</div></div><div class="mt-4 p-3 bg-green-900/30 rounded-lg text-center"><p class="text-green-300 text-sm">✓ Student Task: Classify each item under Threat, Vulnerability, or Risk</p></div></div>`
        },
        { // Slide 19 - Security Controls (3 Types)
            content: () => `<div class="glass-card-deep rounded-3xl p-8 md:p-10"><h2 class="text-3xl font-bold text-green-300 mb-4">🛡️ Security Controls</h2><p class="text-white/70 mb-4">A security control is any measure, tool, policy, or action put in place by an organization to prevent, detect, or reduce security risks to its information assets.</p><div class="grid md:grid-cols-3 gap-4"><div class="p-4 bg-white/5 rounded-xl text-center border border-cyan-500/30"><span class="text-3xl block">💻</span><span class="font-bold text-cyan-300">Technical Controls</span><p class="text-xs mt-1">Antivirus software, firewalls help detect and block malicious attacks.</p></div><div class="p-4 bg-white/5 rounded-xl text-center border border-purple-500/30"><span class="text-3xl block">📋</span><span class="font-bold text-purple-300">Administrative Controls</span><p class="text-xs mt-1">Security policies, employee training ensure staff follow safe practices.</p></div><div class="p-4 bg-white/5 rounded-xl text-center border border-green-500/30"><span class="text-3xl block">🔒</span><span class="font-bold text-green-300">Physical Controls</span><p class="text-xs mt-1">CCTV cameras, security guards prevent unauthorized physical access.</p></div></div></div>`
        },
        { // Slide 20 - Summary & Questions
            content: () => `<div class="glass-card-deep rounded-3xl p-12 md:p-16 text-center"><div class="text-6xl mb-4">🎓🔐</div><h2 class="text-4xl md:text-5xl font-bold bg-gradient-to-r from-cyan-300 to-purple-400 bg-clip-text text-transparent">Summary & Discussion</h2><div class="grid md:grid-cols-2 gap-4 mt-6 text-left"><div class="p-3 bg-white/5 rounded-lg"><span class="text-cyan-300">•</span> Information assets are valuable resources</div><div class="p-3 bg-white/5 rounded-lg"><span class="text-cyan-300">•</span> Threats can harm information systems</div><div class="p-3 bg-white/5 rounded-lg"><span class="text-cyan-300">•</span> Vulnerabilities are weaknesses</div><div class="p-3 bg-white/5 rounded-lg"><span class="text-cyan-300">•</span> Risks occur when threats exploit vulnerabilities</div><div class="p-3 bg-white/5 rounded-lg"><span class="text-cyan-300">•</span> Security controls help reduce risks</div></div><div class="mt-6 p-4 bg-cyan-900/30 rounded-lg"><p class="text-xl text-cyan-300">💬 Questions? Discussion</p><p class="text-white/70 mt-2">Thank You.</p></div><div class="mt-6 flex justify-center gap-2"><div class="w-2 h-2 bg-cyan-400 rounded-full animate-pulse"></div><div class="w-2 h-2 bg-purple-400 rounded-full animate-pulse delay-150"></div><div class="w-2 h-2 bg-cyan-400 rounded-full animate-pulse delay-300"></div></div></div>`
        }
    ];

    let currentIndex = 0;
    const slidesWrapper = document.getElementById('slidesWrapper');
    const slideContainer = document.getElementById('slideContainer');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const slideCounterSpan = document.getElementById('slideCounter');
    const progressFill = document.getElementById('progressFill');

    function renderSlide() {
        if (!slidesWrapper) return;
        slidesWrapper.style.opacity = '0';
        slidesWrapper.style.transform = 'rotateY(15deg) translateZ(-20px)';
        setTimeout(() => {
            slidesWrapper.innerHTML = `<div class="slide-card w-full transition-all duration-700">${slidesData[currentIndex].content()}</div>`;
            slidesWrapper.style.opacity = '1';
            slidesWrapper.style.transform = 'rotateY(0deg) translateZ(0px)';
            slideCounterSpan.innerText = `${currentIndex+1} / ${slidesData.length}`;
            progressFill.style.width = `${((currentIndex + 1) / slidesData.length) * 100}%`;
            if (slideContainer) slideContainer.scrollTop = 0;
        }, 150);
    }

    function nextSlide() { if (currentIndex < slidesData.length - 1) { currentIndex++; renderSlide(); } }
    function prevSlide() { if (currentIndex > 0) { currentIndex--; renderSlide(); } }

    window.addEventListener('keydown', (e) => { if (e.key === 'ArrowRight') nextSlide(); if (e.key === 'ArrowLeft') prevSlide(); });
    let touchStartX = 0;
    document.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].screenX; });
    document.addEventListener('touchend', (e) => { let endX = e.changedTouches[0].screenX; if (endX < touchStartX - 50) nextSlide(); if (endX > touchStartX + 50) prevSlide(); });
    prevBtn?.addEventListener('click', prevSlide);
    nextBtn?.addEventListener('click', nextSlide);
    
    renderSlide();
</script>
</body>
