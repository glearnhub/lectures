<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />

    <title>Lesson 3: Cyber Threats and Malware | Cybersecurity</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Threat Theme: Dark Blue with Red/Green Accents */
        .threat-dark { color: #0D1B2A; }
        .threat-dark-bg { background: #0D1B2A; }
        .threat-red { color: #C0392B; }
        .threat-red-bg { background: #C0392B; }
        .threat-green { color: #27AE60; }
        .threat-green-bg { background: #27AE60; }
        .threat-blue { color: #2979FF; }
        .threat-blue-bg { background: #2979FF; }
        .threat-orange { color: #E67E22; }
        .threat-orange-bg { background: #E67E22; }

        .glass-card-threat {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(13, 27, 42, 0.12);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: radial-gradient(circle at 20% 30%, #f5f5f5, #e8e8e8);
            overflow: hidden;
            height: 100vh;
        }

        .slide-container {
            perspective: 1200px;
            transform-style: preserve-3d;
            height: 100%;
            width: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        .slide-container::-webkit-scrollbar {
            width: 6px;
        }
        .slide-container::-webkit-scrollbar-track {
            background: rgba(192, 57, 43, 0.06);
            border-radius: 10px;
        }
        .slide-container::-webkit-scrollbar-thumb {
            background: #C0392B;
            border-radius: 10px;
        }

        .slide-card {
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            transform-style: preserve-3d;
            backface-visibility: hidden;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .grid-particles {
            background-image:
                linear-gradient(rgba(192, 57, 43, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(192, 57, 43, 0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: shiftGrid 20s linear infinite;
        }

        @keyframes shiftGrid {
            0% { background-position: 0 0; }
            100% { background-position: 40px 40px; }
        }

        .progress-fill {
            transition: width 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #f0f0f0;
        }
        ::-webkit-scrollbar-thumb {
            background: #C0392B;
            border-radius: 4px;
        }

        .bulleted-list {
            list-style-type: disc;
            padding-left: 1.5rem;
            margin: 0.75rem 0;
        }
        .bulleted-list li {
            margin: 0.45rem 0;
            line-height: 1.5;
        }
        .numbered-list {
            list-style-type: decimal;
            padding-left: 1.5rem;
            margin: 0.75rem 0;
        }
        .numbered-list li {
            margin: 0.45rem 0;
            line-height: 1.5;
        }

        .text-dark { color: #1A1A2E; }
        .text-dark-secondary { color: #333333; }
        .text-dark-muted { color: #555555; }

        .code-block {
            background: #0A0A1A;
            border-left: 4px solid #C0392B;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .key-point {
            background: rgba(192, 57, 43, 0.06);
            border-left: 4px solid #C0392B;
            padding: 0.75rem;
            border-radius: 0.5rem;
        }

        .tip-box {
            background: rgba(39, 174, 96, 0.06);
            border-left: 4px solid #27AE60;
            padding: 0.75rem;
            border-radius: 0.5rem;
        }

        .comparison-table th {
            background: rgba(192, 57, 43, 0.06);
            color: #0D1B2A;
        }
        .comparison-table td,
        .comparison-table th {
            padding: 0.5rem;
            border: 1px solid rgba(192, 57, 43, 0.1);
            text-align: left;
        }
        .comparison-table td {
            color: #333333;
        }

        .malware-card {
            transition: all 0.2s ease;
            border: 1px solid rgba(13, 27, 42, 0.08);
        }
        .malware-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        }

        .spread-card {
            transition: all 0.2s ease;
            border: 1px solid rgba(13, 27, 42, 0.08);
        }
        .spread-card:hover {
            transform: translateX(3px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .signs-box {
            background: rgba(230, 126, 34, 0.06);
            border-left: 4px solid #E67E22;
            padding: 0.75rem;
            border-radius: 0.5rem;
        }

        .av-box {
            background: rgba(41, 121, 255, 0.06);
            border-left: 4px solid #2979FF;
            padding: 0.75rem;
            border-radius: 0.5rem;
        }
    </style>
</head>

            content: () => `

                        <p class="text-dark-secondary">A <span class="font-bold text-[#C0392B]">cyber threat</span> is any circumstance or event with the potential to cause harm to an information system through unauthorized access, destruction, disclosure, modification of data, or denial of service.</p>
                        <div class="overflow-x-auto mt-3">

                                <thead><tr><th>Category</th><th>Description</th><th>Example</th></tr></thead>
                                <tbody>
                                    <tr><td class="font-bold text-[#C0392B]">Malware-based threats</td><td>Malicious software designed to damage, disrupt, or gain unauthorized access</td><td>Viruses, worms, ransomware</td></tr>

                                <p class="font-bold text-[#27AE60] text-lg">Worm</p>

                        <div class="grid md:grid-cols-2 gap-3">

        let currentIndex = 0;
        const slidesWrapper = document.getElementById('slidesWrapper');
        const slideContainer = document.getElementById('slideContainer');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const slideCounterSpan = document.getElementById('slideCounter');
        const progressFill = document.getElementById('progressFill');

        function renderSlide() {
            if (!slidesWrapper) return;
            slidesWrapper.style.opacity = '0';
            slidesWrapper.style.transform = 'rotateY(15deg) translateZ(-20px)';
            setTimeout(() => {
                slidesWrapper.innerHTML =
                    `<div class="slide-card w-full transition-all duration-700">${slidesData[currentIndex].content()}</div>`;
                slidesWrapper.style.opacity = '1';
                slidesWrapper.style.transform = 'rotateY(0deg) translateZ(0px)';
                slideCounterSpan.innerText = `${currentIndex+1} / ${slidesData.length}`;
                progressFill.style.width = `${((currentIndex + 1) / slidesData.length) * 100}%`;
                if (slideContainer) slideContainer.scrollTop = 0;
            }, 150);
        }

        function nextSlide() {
            if (currentIndex < slidesData.length - 1) { currentIndex++;
                renderSlide(); }
        }

        function prevSlide() {
            if (currentIndex > 0) { currentIndex--;
                renderSlide(); }
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextSlide();
            if (e.key === 'ArrowLeft') prevSlide();
        });
        let touchStartX = 0;
        document.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].screenX; });
        document.addEventListener('touchend', (e) => {
            let endX = e.changedTouches[0].screenX;
            if (endX < touchStartX - 50) nextSlide();
            if (endX > touchStartX + 50) prevSlide();
        });
        prevBtn?.addEventListener('click', prevSlide);
        nextBtn?.addEventListener('click', nextSlide);

        renderSlide();
    </script>
