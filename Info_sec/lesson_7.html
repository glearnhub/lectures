        .code-block {
            background: #0A0A1A;
            border-left: 4px solid #D4AF37;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-word;

        .case-box {
            background: rgba(212, 175, 55, 0.06);
            border-left: 4px solid #D4AF37;
        }

            background: rgba(0, 180, 216, 0.05);

        .text-dp-white { color: #E8E8E8; }
        .text-dp-gray { color: #AAAAAA; }
        .text-dp-muted { color: #777777; }
        .text-dp-gold { color: #D4AF37; }
        .text-dp-teal { color: #00B4D8; }
        .text-dp-red { color: #E63946; }

        .principle-card {
            transition: all 0.3s ease;
        }
        .principle-card:hover {
            transform: translateY(-3px);

        .backup-rule {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;

        }
        .backup-rule-item {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid #D4AF37;
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
            min-width: 80px;
        }
    </style>
</head>

        // =============================================================

        const slidesData = [{
            // Slide 1 - Title
            content: () => `
                    <div class="glass-card-dp rounded-3xl p-8 md:p-12 text-center relative min-h-[55vh]">
                        <div class="absolute -top-20 left-1/2 transform -translate-x-1/2 w-48 h-48 bg-[#D4AF37]/5 rounded-full blur-3xl animate-pulse"></div>
                        <div class="relative z-10">

                                </div>
                            </div>
                            <p class="text-xs text-[#D4AF37] font-bold tracking-[0.3em] mb-1">INTRODUCTION TO INFORMATION SECURITY</p>
                            <p class="text-xs text-dp-muted mb-2">Lesson Notes: Data Protection Fundamentals</p>
                            <p class="text-xs text-dp-muted mb-2"></p>
                            <h1 class="text-3xl md:text-5xl font-extrabold dp-glow mb-3 text-white">Data Protection Fundamentals</h1>
                            <div class="w-24 h-1 bg-gradient-to-r from-[#D4AF37] to-[#00B4D8] mx-auto mb-4"></div>
                            <div class="mt-6 flex gap-3 justify-center flex-wrap">
                                <span class="px-3 py-1 rounded-full bg-[#D4AF37]/10 border border-[#D4AF37]/20 text-sm text-dp-gray">Importance of Data Protection</span>
                                <span class="px-3 py-1 rounded-full bg-[#D4AF37]/10 border border-[#D4AF37]/20 text-sm text-dp-gray">Personal vs Organisational Data</span>
                                <span class="px-3 py-1 rounded-full bg-[#D4AF37]/10 border border-[#D4AF37]/20 text-sm text-dp-gray">Data Protection Principles</span>
                                <span class="px-3 py-1 rounded-full bg-[#D4AF37]/10 border border-[#D4AF37]/20 text-sm text-dp-gray">Data Privacy Laws</span>

                            </div>

        }, {
            // Slide 2 - Lesson Outline
            content: () => `
                    <div class="glass-card-dp rounded-3xl p-8 md:p-10">
                        <h2 class="text-3xl md:text-4xl font-bold text-[#D4AF37] mb-4">Lesson Outline</h2>
                        <div class="p-3 bg-[#D4AF37]/5 rounded-lg border border-[#D4AF37]/20">
                            <p class="text-dp-gray"><span class="text-[#D4AF37] font-bold">Importance of Data Protection • Personal vs Organisational Data • Data Protection Principles • Introduction to Data Privacy Laws • Encryption and Data Security • Data Backup and Recovery</span></p>
                        </div>
                    </div>
                `
        }, {
            // Slide 3 - Importance of Data Protection
            content: () => `
                    <div class="glass-card-dp rounded-3xl p-8 md:p-10">
                        <h2 class="text-3xl md:text-4xl font-bold text-[#D4AF37] mb-4">1. Importance of Data Protection</h2>
                        <p class="text-dp-gray leading-relaxed">Data protection refers to the practices, safeguards, and rules put in place to ensure that personal and organisational information is collected, stored, and used responsibly, and is kept safe from loss, theft, or misuse.</p>
                        <div class="p-3 bg-[#D4AF37]/5 rounded-lg mt-3">
                            <p class="font-bold text-[#D4AF37]">Why It Matters</p>
                            <ul class="bulleted-list text-sm text-dp-gray">
                                <li><span class="text-[#D4AF37]">Everyday transactions:</span> Every time someone registers a SIM card with Safaricom, opens an M-Pesa account, applies for a Huduma Namba, or signs up for a bank account at Equity or KCB, they hand over personal data that must be protected.</li>
                                <li><span class="text-[#D4AF37]">Sensitive health data:</span> Hospitals such as Kenyatta National Hospital and Aga Khan University Hospital hold sensitive patient records — misuse or leakage could cause real harm (discrimination, stigma, identity theft).</li>
                                <li><span class="text-[#D4AF37]">Trust and reputation:</span> Data breaches damage trust. When a company loses customer data, people stop trusting it with their money or information.</li>
                                <li><span class="text-[#D4AF37]">Financial loss:</span> Cybercrime, including data breaches, costs Kenyan businesses billions of shillings annually through fraud, extortion, and regulatory fines.</li>
                                <li><span class="text-[#D4AF37]">Legal consequences:</span> Kenya's Data Protection Act, 2019 imposes penalties on organisations that fail to protect personal data — including fines of up to KES 5 million or 1% of annual turnover.</li>
                                <li><span class="text-[#D4AF37]">National development:</span> Kenya's digital economy (mobile money, e-government services like eCitizen, e-commerce) depends on people trusting that their data is safe.</li>
                            </ul>
                        </div>
                        <div class="discussion-box p-2 rounded-lg mt-2">
                            <p class="text-xs text-dp-muted">💬 Discussion Prompt: Ask learners to share an example of a time they were asked for personal information (e.g., at a cyber café, when registering a SIM, or applying for a loan app like Tala or Branch) and whether they felt confident about how that data would be used.</p>
                        </div>
                    </div>
                `
        }, {
            // Slide 4 - Personal vs Organisational Data - Personal Data
            content: () => `
                    <div class="glass-card-dp rounded-3xl p-8 md:p-10">
                        <h2 class="text-3xl md:text-4xl font-bold text-[#D4AF37] mb-4">2. Personal vs Organisational Data</h2>
                        <div class="p-3 bg-[#00B4D8]/5 rounded-lg border border-[#00B4D8]/20">
                            <p class="font-bold text-[#00B4D8] text-lg">Personal Data</p>
                            <p class="text-sm text-dp-gray">Information that relates to an identified or identifiable individual.</p>
                            <p class="font-bold text-[#D4AF37] text-sm mt-2">Examples in the Kenyan context:</p>
                            <ul class="bulleted-list text-sm text-dp-gray">
                                <li>National ID number, KRA PIN, passport number</li>
                                <li>Phone number and M-Pesa transaction history</li>
                                <li>Name, date of birth, home address</li>
                                <li>Biometric data (fingerprints used for Huduma Namba or SIM registration)</li>
                                <li>Health records from a clinic or hospital</li>
                                <li>Academic records (KCPE/KCSE results, university transcripts from KUCCPS)</li>
                            </ul>
                        </div>
                    </div>
                `
        }, {
            // Slide 5 - Organisational Data
            content: () => `
                    <div class="glass-card-dp rounded-3xl p-8 md:p-10">
                        <h2 class="text-3xl md:text-4xl font-bold text-[#D4AF37] mb-4">Organisational Data</h2>
                        <div class="p-3 bg-[#D4AF37]/5 rounded-lg border border-[#D4AF37]/20">
                            <p class="font-bold text-[#D4AF37] text-lg">Organisational Data</p>
                            <p class="text-sm text-dp-gray">Information that belongs to or is generated by a business, government agency, or institution — it may include personal data but also covers broader business information.</p>
                            <ul class="bulleted-list text-sm text-dp-gray mt-2">
                                <li>Employee payroll records at a company like Safaricom or KPLC</li>
                                <li>Customer databases held by a bank or Sacco</li>
                                <li>Business financial statements, strategic plans, and trade secrets</li>
                                <li>Government records held by agencies like KRA or the National Transport and Safety Authority (NTSA)</li>
                                <li>Supplier contracts and procurement records</li>
                            </ul>
                        </div>
                    </div>
                `
        }, {
            // Slide 6 - Key Distinctions
            content: () => `
                    <div class="glass-card-dp rounded-3xl p-8 md:p-10">
                        <h2 class="text-3xl md:text-4xl font-bold text-[#D4AF37] mb-4">Key Distinctions</h2>
                        <div class="overflow-x-auto">
                            <table class="comparison-table w-full border-collapse text-sm">
                                <thead><tr><th>Aspect</th><th>Personal Data</th><th>Organisational Data</th></tr></thead>
                                <tbody>
                                    <tr><td class="font-bold text-[#D4AF37]">Ownership</td><td>Belongs to the individual</td><td>Belongs to the organisation</td></tr>
                                    <tr><td class="font-bold text-[#D4AF37]">Example</td><td>Your KRA PIN</td><td>KRA's internal tax database</td></tr>
                                    <tr><td class="font-bold text-[#D4AF37]">Who decides how it's used</td><td>The data subject (with consent)</td><td>The organisation, within the law</td></tr>
                                    <tr><td class="font-bold text-[#D4AF37]">Risk if leaked</td><td>Identity theft, fraud, harassment</td><td>Financial loss, competitive disadvantage, regulatory action</td></tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="activity-box p-2 rounded-lg mt-2">
                            <p class="text-xs text-dp-muted">📝 Activity: In pairs, learners list five pieces of data a Sacco would hold, then sort each into "personal" or "organisational."</p>
                        </div>
                    </div>
                `
        }, {
            // Slide 7 - Data Protection Principles Overview
            content: () => `
                    <div class="glass-card-dp rounded-3xl p-8 md:p-10">
                        <h2 class="text-3xl md:text-4xl font-bold text-[#D4AF37] mb-4">3. Data Protection Principles</h2>
                        <p class="text-dp-gray">Kenya's <span class="text-[#D4AF37] font-bold">Data Protection Act, 2019</span> sets out core principles that mirror international standards (such as the EU's GDPR). Every organisation handling personal data — from a small Sacco to Safaricom — must observe these:</p>
                        <div class="grid md:grid-cols-2 gap-2 mt-3">
                            <div class="principle-card p-2 bg-[#D4AF37]/5 rounded border border-[#D4AF37]/20">
                                <p class="font-bold text-[#D4AF37] text-sm">1. Lawfulness, fairness, and transparency</p>
                                <p class="text-xs text-dp-gray">Data must be collected honestly and the person must know why. Example: when applying for a Fuliza loan, Safaricom/KCB must clearly explain how your data will be used.</p>
                            </div>
                            <div class="principle-card p-2 bg-[#D4AF37]/5 rounded border border-[#D4AF37]/20">
                                <p class="font-bold text-[#D4AF37] text-sm">2. Purpose limitation</p>
                                <p class="text-xs text-dp-gray">Data collected for one reason (e.g., SIM registration for security purposes) should not be repurposed for something else, like unsolicited marketing, without consent.</p>
                            </div>
                            <div class="principle-card p-2 bg-[#D4AF37]/5 rounded border border-[#D4AF37]/20">
                                <p class="font-bold text-[#D4AF37] text-sm">3. Data minimisation</p>
                                <p class="text-xs text-dp-gray">Only collect what is necessary. A retail shop asking for your national ID number just to sell you a phone charger would violate this principle.</p>
                            </div>
                            <div class="principle-card p-2 bg-[#D4AF37]/5 rounded border border-[#D4AF37]/20">
                                <p class="font-bold text-[#D4AF37] text-sm">4. Accuracy</p>
                                <p class="text-xs text-dp-gray">Data held must be correct and kept up to date. Example: KRA must ensure your iTax records reflect accurate income details.</p>
                            </div>
                        </div>
                    </div>
                `
        }, {
            // Slide 8 - Data Protection Principles (Continued)
            content: () => `
                    <div class="glass-card-dp rounded-3xl p-8 md:p-10">
                        <h2 class="text-3xl md:text-4xl font-bold text-[#D4AF37] mb-4">Data Protection Principles (Continued)</h2>
                        <div class="grid md:grid-cols-3 gap-2">
                            <div class="principle-card p-2 bg-[#D4AF37]/5 rounded border border-[#D4AF37]/20">
                                <p class="font-bold text-[#D4AF37] text-sm">5. Storage limitation</p>
                                <p class="text-xs text-dp-gray">Data should not be kept longer than necessary. A cyber café should not retain your ID copy indefinitely after you've used their services.</p>
                            </div>
                            <div class="principle-card p-2 bg-[#D4AF37]/5 rounded border border-[#D4AF37]/20">
                                <p class="font-bold text-[#D4AF37] text-sm">6. Integrity and confidentiality (security)</p>
                                <p class="text-xs text-dp-gray">Data must be protected against unauthorised access, loss, or damage — e.g., a hospital securing patient files from hackers.</p>
                            </div>
                            <div class="principle-card p-2 bg-[#D4AF37]/5 rounded border border-[#D4AF37]/20">
                                <p class="font-bold text-[#D4AF37] text-sm">7. Accountability</p>
                                <p class="text-xs text-dp-gray">The data controller (e.g., a bank) must be able to demonstrate compliance with these principles, and is answerable to the Office of the Data Protection Commissioner (ODPC).</p>
                            </div>
                        </div>
                        <div class="case-box p-2 rounded-lg mt-2">
                            <p class="font-bold text-[#D4AF37] text-xs">Case Example</p>
                            <p class="text-xs text-dp-gray">In 2020, several Kenyan loan apps were investigated for accessing users' phone contacts and messages without proper consent to shame defaulters — a clear violation of purpose limitation and data minimisation.</p>
                        </div>
                    </div>
                `

            // Slide 9 - Introduction to Data Privacy Laws
            content: () => `
                    <div class="glass-card-dp rounded-3xl p-8 md:p-10">
                        <h2 class="text-3xl md:text-4xl font-bold text-[#D4AF37] mb-4">4. Introduction to Data Privacy Laws</h2>
                        <p class="font-bold text-[#00B4D8]">Kenyan Legal Framework</p>
                        <ul class="bulleted-list text-sm text-dp-gray">
                            <li><span class="text-[#D4AF37] font-bold">The Constitution of Kenya, 2010, Article 31</span> — guarantees the right to privacy, including protection from unnecessary disclosure of personal information.</li>
                            <li><span class="text-[#D4AF37] font-bold">The Data Protection Act, 2019</span> — Kenya's primary data protection law, establishing the Office of the Data Protection Commissioner (ODPC), and setting rules for collection, processing, and storage of personal data by both public and private bodies.</li>
                            <li><span class="text-[#D4AF37] font-bold">Data Protection (General) Regulations, 2021</span> — provide operational detail on consent, data subject rights, and registration of data controllers/processors.</li>
                            <li><span class="text-[#D4AF37] font-bold">Computer Misuse and Cybercrimes Act, 2018</span> — addresses unauthorised access, cyber fraud, and related offences (relevant alongside data protection).</li>
                            <li><span class="text-[#D4AF37] font-bold">Kenya Information and Communications Act (KICA)</span> — governs telecommunications and electronic transactions, including SIM card registration rules.</li>
                        </ul>
                    </div>
                `

            content: () => `
                    <div class="glass-card-dp rounded-3xl p-8 md:p-10">
                        <h2 class="text-3xl md:text-4xl font-bold text-[#D4AF37] mb-4">Rights of a Data Subject in Kenya</h2>
                        <ul class="bulleted-list text-sm text-dp-gray">
                            <li>Right to be informed of how data is used</li>

        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const slideCounterSpan = document.getElementById('slideCounter');
        const progressFill = document.getElementById('progressFill');

        function renderSlide() {
            if (!slidesWrapper) return;
            slidesWrapper.style.opacity = '0';
            slidesWrapper.style.transform = 'rotateY(15deg) translateZ(-20px)';
            setTimeout(() => {
                slidesWrapper.innerHTML =
                    `<div class="slide-card w-full transition-all duration-700">${slidesData[currentIndex].content()}</div>`;
                slidesWrapper.style.opacity = '1';
                slidesWrapper.style.transform = 'rotateY(0deg) translateZ(0px)';
                slideCounterSpan.innerText = `${currentIndex+1} / ${slidesData.length}`;
                progressFill.style.width = `${((currentIndex + 1) / slidesData.length) * 100}%`;
                if (slideContainer) slideContainer.scrollTop = 0;
            }, 150);
        }

        function nextSlide() {
            if (currentIndex < slidesData.length - 1) { currentIndex++;
                renderSlide(); }
        }

        function prevSlide() {
            if (currentIndex > 0) { currentIndex--;
                renderSlide(); }
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextSlide();
            if (e.key === 'ArrowLeft') prevSlide();
        });
        let touchStartX = 0;
        document.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].screenX; });
        document.addEventListener('touchend', (e) => {
            let endX = e.changedTouches[0].screenX;
            if (endX < touchStartX - 50) nextSlide();
            if (endX > touchStartX + 50) prevSlide();
        });
        prevBtn?.addEventListener('click', prevSlide);
        nextBtn?.addEventListener('click', nextSlide);

        renderSlide();
