<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />

    <title>Introduction to Information Security | Data Protection Fundamentals</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Data Protection Theme: Dark Blue with Gold/Teal Accents */
        .dp-dark { color: #0A1628; }
        .dp-dark-bg { background: #0A1628; }
        .dp-gold { color: #D4AF37; }
        .dp-gold-bg { background: #D4AF37; }
        .dp-teal { color: #00B4D8; }
        .dp-teal-bg { background: #00B4D8; }
        .dp-red { color: #E63946; }
        .dp-border { border-color: #D4AF37; }

        .glass-card-dp {
            background: rgba(10, 22, 40, 0.92);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 55, 0.25);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 0 0 20px rgba(212, 175, 55, 0.06);
        }

        .glass-card-dp-light {
            background: rgba(10, 22, 40, 0.75);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(212, 175, 55, 0.15);
        }

        .dp-glow {
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.3), 0 0 40px rgba(212, 175, 55, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: radial-gradient(circle at 20% 30%, #0A1628, #050D1A);
            overflow: hidden;
            height: 100vh;
        }

        .slide-container {
            perspective: 1200px;
            transform-style: preserve-3d;
            height: 100%;
            width: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        .slide-container::-webkit-scrollbar {
            width: 6px;
        }
        .slide-container::-webkit-scrollbar-track {
            background: rgba(212, 175, 55, 0.08);
            border-radius: 10px;
        }
        .slide-container::-webkit-scrollbar-thumb {
            background: #D4AF37;
            border-radius: 10px;
        }

        .slide-card {
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            transform-style: preserve-3d;
            backface-visibility: hidden;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .grid-particles {
            background-image:
                linear-gradient(rgba(212, 175, 55, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(212, 175, 55, 0.06) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: shiftGrid 20s linear infinite;
        }

        @keyframes shiftGrid {
            0% { background-position: 0 0; }
            100% { background-position: 40px 40px; }
        }

        .progress-fill {
            transition: width 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #0A1628;
        }
        ::-webkit-scrollbar-thumb {
            background: #D4AF37;
            border-radius: 4px;
        }

        .bulleted-list {
            list-style-type: disc;
            padding-left: 1.5rem;
            margin: 0.75rem 0;
        }
        .bulleted-list li {
            margin: 0.45rem 0;
            line-height: 1.5;
        }
        .numbered-list {
            list-style-type: decimal;
            padding-left: 1.5rem;
            margin: 0.75rem 0;
        }
        .numbered-list li {
            margin: 0.45rem 0;
            line-height: 1.5;
        }

        .code-block {
            background: #0A0A1A;
            border-left: 4px solid #D4AF37;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .case-box {
            background: rgba(212, 175, 55, 0.06);
            border-left: 4px solid #D4AF37;
        }

        .discussion-box {
            background: rgba(0, 180, 216, 0.05);
            border-left: 4px solid #00B4D8;
        }

        .activity-box {
            background: rgba(230, 57, 70, 0.05);
            border-left: 4px solid #E63946;
        }

        .comparison-table th {
            background: rgba(212, 175, 55, 0.1);
            color: #D4AF37;
        }
        .comparison-table td,
        .comparison-table th {
            padding: 0.5rem;
            border: 1px solid rgba(212, 175, 55, 0.12);
            text-align: left;
        }
        .comparison-table td {
            color: #CCCCCC;
        }

        .text-dp-white { color: #E8E8E8; }
        .text-dp-gray { color: #AAAAAA; }
        .text-dp-muted { color: #777777; }
        .text-dp-gold { color: #D4AF37; }
        .text-dp-teal { color: #00B4D8; }
        .text-dp-red { color: #E63946; }

        .principle-card {
            transition: all 0.3s ease;
        }
        .principle-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.15);
        }

        .backup-rule {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .backup-rule-item {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid #D4AF37;
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
            min-width: 80px;
        }
    </style>
</head>
<body class="text-dp-white overflow-hidden h-screen w-screen">

                        <button id="nextBtn" class="p-2 rounded-full bg-white/5 backdrop-blur border border-[#D4AF37]/30 hover:bg-[#D4AF37]/20 transition-all duration-300 transform hover:scale-110">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#D4AF37" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>

                    </div>
                </div>
                <div class="w-full h-1.5 bg-[#0A2A3A]/80 rounded-full overflow-hidden backdrop-blur-sm">

            <!-- Slide Content Area -->

            <div class="fixed bottom-3 left-1/2 transform -translate-x-1/2 z-30 text-[#D4AF37]/40 text-[10px] font-mono bg-[#0A1628]/80 px-3 py-1 rounded-full backdrop-blur-sm border border-[#D4AF37]/10">
                ↑↓ Scroll • ← → Navigate slides
            </div>
        </div>

                                <span class="px-3 py-1 rounded-full bg-[#D4AF37]/10 border border-[#D4AF37]/20 text-sm text-dp-gray">Data Protection Principles</span>

                            <div class="p-3 bg-[#D4AF37]/5 rounded-lg border border-[#D4AF37]/20 text-center">

                            <div class="p-3 bg-[#D4AF37]/5 rounded-lg border border-[#D4AF37]/20 text-center">

                            <div class="p-3 bg-[#D4AF37]/5 rounded-lg border border-[#D4AF37]/20 text-center">

                            <div class="p-3 bg-[#D4AF37]/5 rounded-lg border border-[#D4AF37]/20 text-center">

            content: () => `

                        <p class="text-dp-gray leading-relaxed"><span class="text-[#D4AF37] font-bold">Data protection</span> refers to the practices, safeguards, and rules put in place to ensure that personal and organisational information is collected, stored, and used responsibly, and is kept safe from loss, theft, or misuse.</p>
                        <div class="grid md:grid-cols-2 gap-2 mt-3">
                            <div class="p-2 bg-[#D4AF37]/5 rounded border-l-4 border-[#D4AF37]">
                                <p class="text-xs text-dp-gray"><span class="text-[#D4AF37]">Everyday transactions:</span> SIM registration, M-Pesa, Huduma Namba, bank accounts</p>

            content: () => `

                        <div class="p-3 bg-[#00B4D8]/5 rounded-lg border border-[#00B4D8]/20">
                            <p class="font-bold text-[#00B4D8] text-lg">Personal Data</p>
                            <p class="text-sm text-dp-gray">Information that relates to an identified or identifiable individual.</p>

                        <div class="p-3 bg-[#D4AF37]/5 rounded-lg border border-[#D4AF37]/20">

                            <p class="text-sm text-dp-gray">Information that belongs to or is generated by a business, government agency, or institution — may include personal data but also covers broader business information.</p>
                            <ul class="bulleted-list text-xs text-dp-gray mt-1">
                                <li>Employee payroll records (Safaricom, KPLC)</li>
                                <li>Customer databases (banks, Saccos)</li>
                                <li>Business financial statements, strategic plans, trade secrets</li>
                                <li>Government records (KRA, NTSA)</li>
                                <li>Supplier contracts and procurement records</li>
                            </ul>

                    </div>
                `

                        <p class="text-dp-gray">Kenya's <span class="text-[#D4AF37] font-bold">Data Protection Act, 2019</span> sets out core principles that mirror international standards (such as the EU's GDPR). Every organisation handling personal data must observe these:</p>

                            <div class="principle-card p-2 bg-[#D4AF37]/5 rounded border border-[#D4AF37]/20">

        function prevSlide() {
            if (currentIndex > 0) { currentIndex--;
                renderSlide(); }
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextSlide();
            if (e.key === 'ArrowLeft') prevSlide();
        });
        let touchStartX = 0;
        document.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].screenX; });
        document.addEventListener('touchend', (e) => {
            let endX = e.changedTouches[0].screenX;
            if (endX < touchStartX - 50) nextSlide();
            if (endX > touchStartX + 50) prevSlide();
        });
        prevBtn?.addEventListener('click', prevSlide);
        nextBtn?.addEventListener('click', nextSlide);

        renderSlide();
    </script>
</body>
</html>
