    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 6s ease-in-out infinite',
                        'glow-pulse': 'glowPulse 2s ease-in-out infinite',
                        'spin-slow': 'spin 8s linear infinite',
                        'border-flow': 'borderFlow 3s linear infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-20px)' },
                        },
                        glowPulse: {
                            '0%, 100%': { boxShadow: '0 0 5px #00ffff, 0 0 10px #00ffff, 0 0 15px #00ffff' },
                            '50%': { boxShadow: '0 0 20px #00ffff, 0 0 30px #00aaff, 0 0 40px #00aaff' },
                        },
                        borderFlow: {
                            '0%': { borderColor: '#00ffff', boxShadow: '0 0 10px #00ffff' },
                            '50%': { borderColor: '#a855f7', boxShadow: '0 0 20px #a855f7' },
                            '100%': { borderColor: '#00ffff', boxShadow: '0 0 10px #00ffff' },
                        }
                    },
                    backdropBlur: {
                        xs: '2px',
                    }
                }
            }
        }

    <style>
        /* Additional custom 3D and glassmorphism effects */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none; /* Improves swipe feel on mobile */
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: radial-gradient(circle at 20% 30%, #0a0a2a, #020210);
            overflow-x: hidden;
        }

        /* 3D Slide Container */
        .slide-container {
            perspective: 1200px;
            transform-style: preserve-3d;
        }

        .slide-card {
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            transform-style: preserve-3d;
            backface-visibility: hidden;
        }

        /* Slide transition animations */
        .slide-enter {
            opacity: 0;
            transform: rotateY(25deg) translateZ(-50px) scale(0.95);
        }
        .slide-active {
            opacity: 1;
            transform: rotateY(0deg) translateZ(0px) scale(1);
        }
        .slide-exit {
            opacity: 0;
            transform: rotateY(-25deg) translateZ(-50px) scale(0.95);
        }

        /* Glowing glass effect */
        .glass-card-deep {
            background: rgba(10, 20, 40, 0.45);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 255, 255, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2), 0 0 15px rgba(0, 255, 255, 0.2);
        }

        /* Floating particles simulation (CSS grid layer) */
        .grid-particles {
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: shiftGrid 20s linear infinite;
        }
        @keyframes shiftGrid {
            0% { background-position: 0 0; }
            100% { background-position: 40px 40px; }
        }

        /* 3D floating lock animation */
        .lock-3d {
            animation: float3d 4s ease-in-out infinite;
            transform-style: preserve-3d;
        }
        @keyframes float3d {
            0% { transform: translateZ(0px) rotateY(0deg); }
            50% { transform: translateZ(30px) rotateY(15deg); }
            100% { transform: translateZ(0px) rotateY(0deg); }
        }

        /* Shield glow effect */
        .shield-glow {
            animation: shieldPulse 2s infinite alternate;
        }
        @keyframes shieldPulse {
            0% { filter: drop-shadow(0 0 5px #00ffff); opacity: 0.8; }
            100% { filter: drop-shadow(0 0 25px #00aaff); opacity: 1; }
        }

        /* Progress bar animated */
        .progress-fill {
            transition: width 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        /* custom scroll hide */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0a2a;
        }
        ::-webkit-scrollbar-thumb {
            background: #00ffff;
            border-radius: 4px;
        }

        /* swipe hint */
        @media (max-width: 768px) {
            .swipe-hint {
                display: flex;
            }
        }
    </style>
</head>

        // Slide management
        let currentIndex = 0;
        const slidesWrapper = document.getElementById('slidesWrapper');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const slideCounterSpan = document.getElementById('slideCounter');
        const progressFill = document.getElementById('progressFill');

        function renderSlide() {
            if (!slidesWrapper) return;
            // 3D transition effect: add class for animation
            slidesWrapper.style.opacity = '0';
            slidesWrapper.style.transform = 'rotateY(15deg) translateZ(-20px)';
            setTimeout(() => {
                const slideHtml = slidesData[currentIndex].content();
                slidesWrapper.innerHTML = `<div class="slide-card w-full transition-all duration-700 glass-card-deep rounded-3xl p-6 md:p-10 shadow-2xl border border-white/20">${slideHtml}</div>`;
                slidesWrapper.style.opacity = '1';
                slidesWrapper.style.transform = 'rotateY(0deg) translateZ(0px)';
                updateProgressAndCounter();
            }, 150);
        }

        function updateProgressAndCounter() {
            slideCounterSpan.innerText = `${currentIndex+1} / ${slidesData.length}`;
            const percent = ((currentIndex + 1) / slidesData.length) * 100;
            progressFill.style.width = `${percent}%`;
        }

        function nextSlide() {
            if (currentIndex < slidesData.length - 1) {
                currentIndex++;
                renderSlide();
            } else {
                // visual feedback at end of presentation
                progressFill.style.boxShadow = '0 0 8px cyan';
                setTimeout(()=> progressFill.style.boxShadow = '', 300);
            }
        }

        function prevSlide() {
            if (currentIndex > 0) {
                currentIndex--;
                renderSlide();
            }
        }

        // Keyboard navigation
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextSlide();
            if (e.key === 'ArrowLeft') prevSlide();
        });

        // Swipe Support (Touch)
        let touchStartX = 0;
        let touchEndX = 0;
        function handleTouchStart(e) {
            touchStartX = e.changedTouches[0].screenX;
        }
        function handleTouchEnd(e) {
            touchEndX = e.changedTouches[0].screenX;
            if (touchEndX < touchStartX - 50) nextSlide();
            if (touchEndX > touchStartX + 50) prevSlide();
        }
        document.addEventListener('touchstart', handleTouchStart);
        document.addEventListener('touchend', handleTouchEnd);

        // button listeners
        prevBtn?.addEventListener('click', prevSlide);
        nextBtn?.addEventListener('click', nextSlide);

        // Initial render
        renderSlide();
    </script>
</body>
</html>
