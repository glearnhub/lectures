    // Slide Engine with vertical scroll support
    let currentIndex = 0;
    const slidesWrapper = document.getElementById('slidesWrapper');
    const slideContainer = document.getElementById('slideContainer');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const slideCounterSpan = document.getElementById('slideCounter');
    const progressFill = document.getElementById('progressFill');

    function renderSlide() {
        if (!slidesWrapper) return;
        // Fade + 3D rotation transition
        slidesWrapper.style.opacity = '0';
        slidesWrapper.style.transform = 'rotateY(15deg) translateZ(-20px)';
        
        setTimeout(() => {
            const slideHtml = slidesData[currentIndex].content();
            slidesWrapper.innerHTML = `<div class="slide-card w-full transition-all duration-700">${slideHtml}</div>`;
            slidesWrapper.style.opacity = '1';
            slidesWrapper.style.transform = 'rotateY(0deg) translateZ(0px)';
            updateProgressAndCounter();
            
            // Scroll to top of slide container when changing slides (for better UX)
            if (slideContainer) {
                slideContainer.scrollTop = 0;
            }
        }, 150);
    }

    function updateProgressAndCounter() {
        slideCounterSpan.innerText = `${currentIndex+1} / ${slidesData.length}`;
        const percent = ((currentIndex + 1) / slidesData.length) * 100;
        progressFill.style.width = `${percent}%`;
    }

    function nextSlide() { 
        if (currentIndex < slidesData.length - 1) { 
            currentIndex++; 
            renderSlide(); 
        } else { 
            progressFill.style.boxShadow = '0 0 8px cyan'; 
            setTimeout(()=> progressFill.style.boxShadow = '', 300); 
        } 
    }
    
    function prevSlide() { 
        if (currentIndex > 0) { 
            currentIndex--; 
            renderSlide(); 
        } 
    }

    // Keyboard navigation
    window.addEventListener('keydown', (e) => { 
        if (e.key === 'ArrowRight') nextSlide(); 
        if (e.key === 'ArrowLeft') prevSlide(); 
    });
    
    // Swipe Support (Touch)
    let touchStartX = 0;
    document.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].screenX; });
    document.addEventListener('touchend', (e) => { 
        let endX = e.changedTouches[0].screenX; 
        if (endX < touchStartX - 50) nextSlide(); 
        if (endX > touchStartX + 50) prevSlide(); 
    });
    
    prevBtn?.addEventListener('click', prevSlide);
    nextBtn?.addEventListener('click', nextSlide);
    
    // Initial render
    renderSlide();
</script>
</body>
