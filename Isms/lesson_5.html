                <div class="glass-card-deep rounded-3xl p-8 md:p-10">
                    <h2 class="text-3xl md:text-4xl font-bold text-cyan-300 mb-4">What is Access Control?</h2>
                    <p class="text-white/70 leading-relaxed">Access control is a security mechanism that determines who or what is allowed to view, use, or modify resources in a computing environment. It is one of the fundamental pillars of information security, alongside confidentiality, integrity, and availability (the CIA triad).</p>

                        <p class="font-bold text-cyan-300">Kenyan Example:</p>
                        <p class="text-sm">Think of M-Pesa: only the registered account holder (identified by their ID number and SIM card) can send money. A teller at a Cooperative Bank branch can view customer balances but cannot approve loans — that requires a bank manager. This is access control in everyday life.</p>

            content: () => `
                <div class="glass-card-deep rounded-3xl p-8 md:p-10">
                    <h2 class="text-3xl md:text-4xl font-bold text-cyan-300 mb-4">Core Access Control Principles</h2>
                    <div class="space-y-3">
                        <div class="p-3 bg-white/5 rounded-lg">
                            <p class="font-bold text-cyan-300">Principle of Least Privilege</p>
                            <p class="text-sm">Every user, program, or system component should be given only the minimum access rights necessary to perform its job.</p>
                            <p class="text-xs text-white/50 mt-1">Example: A data entry clerk at KRA can enter tax returns but cannot approve refunds or view audit logs.</p>

                        <div class="p-3 bg-white/5 rounded-lg">
                            <p class="font-bold text-purple-300">Need-to-Know Principle</p>

                            <p class="text-sm">Critical tasks are divided among multiple people to prevent fraud and errors.</p>

            content: () => `
                <div class="glass-card-deep rounded-3xl p-8 md:p-10">
                    <h2 class="text-3xl md:text-4xl font-bold text-cyan-300 mb-4">Discretionary Access Control (DAC)</h2>
                    <p class="text-white/70">In DAC, the owner of a resource decides who can access it. Access rights are granted at the owner's discretion. This is the most flexible — but least secure — model.</p>
                    <div class="kenya-box p-3 rounded-lg mt-3">
                        <p class="font-bold text-cyan-300">Kenyan Example:</p>
                        <p class="text-sm">A lecturer at the University of Nairobi creates an exam paper and stores it on a shared Google Drive folder. They can choose to share with specific colleagues (read-only) or with the department head (editor). The lecturer, as the owner, decides who sees what — that is DAC.</p>
                    </div>
                    <div class="grid md:grid-cols-2 gap-3 mt-3">
                        <div class="p-2 bg-green-500/10 rounded"><span class="font-bold text-green-300">Advantages:</span> Flexible, easy to implement in small environments</div>
                        <div class="p-2 bg-red-500/10 rounded"><span class="font-bold text-red-300">Disadvantages:</span> Owners may make poor security decisions, permissions can propagate uncontrollably</div>

                </div>

            content: () => `
                <div class="glass-card-deep rounded-3xl p-8 md:p-10">
                    <h2 class="text-3xl md:text-4xl font-bold text-cyan-300 mb-4">Mandatory Access Control (MAC)</h2>
                    <p class="text-white/70">In MAC, access decisions are made by a central authority (the system/administrator), not by individual owners. Resources and users are assigned security labels/classifications, and the system enforces access based on policy.</p>

                    <p class="text-white/70">RBAC assigns permissions to roles (job functions) rather than to individual users. Users are assigned to roles, and they inherit the permissions of those roles. This is the most widely used model in enterprises today.</p>
                    <div class="kenya-box p-3 rounded-lg mt-3">
                        <p class="font-bold text-cyan-300">Kenyan Example - Equity Bank:</p>

                        </ul>
                        <p class="text-xs text-white/50 mt-1">When a teller is promoted to manager, the IT team simply changes their role — no need to reconfigure individual permissions.</p>

                    <div class="grid md:grid-cols-2 gap-3 mt-4">

    let currentIndex = 0;
    const slidesWrapper = document.getElementById('slidesWrapper');
    const slideContainer = document.getElementById('slideContainer');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const slideCounterSpan = document.getElementById('slideCounter');
    const progressFill = document.getElementById('progressFill');

    function renderSlide() {
        if (!slidesWrapper) return;
        slidesWrapper.style.opacity = '0';
        slidesWrapper.style.transform = 'rotateY(15deg) translateZ(-20px)';
        setTimeout(() => {
            slidesWrapper.innerHTML = `<div class="slide-card w-full transition-all duration-700">${slidesData[currentIndex].content()}</div>`;
            slidesWrapper.style.opacity = '1';
            slidesWrapper.style.transform = 'rotateY(0deg) translateZ(0px)';
            slideCounterSpan.innerText = `${currentIndex+1} / ${slidesData.length}`;
            progressFill.style.width = `${((currentIndex + 1) / slidesData.length) * 100}%`;
            if (slideContainer) slideContainer.scrollTop = 0;
        }, 150);
    }

    function nextSlide() { if (currentIndex < slidesData.length - 1) { currentIndex++; renderSlide(); } }
    function prevSlide() { if (currentIndex > 0) { currentIndex--; renderSlide(); } }

    window.addEventListener('keydown', (e) => { if (e.key === 'ArrowRight') nextSlide(); if (e.key === 'ArrowLeft') prevSlide(); });
    let touchStartX = 0;
    document.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].screenX; });
    document.addEventListener('touchend', (e) => { let endX = e.changedTouches[0].screenX; if (endX < touchStartX - 50) nextSlide(); if (endX > touchStartX + 50) prevSlide(); });
    prevBtn?.addEventListener('click', prevSlide);
    nextBtn?.addEventListener('click', nextSlide);
    
    renderSlide();
</script>
