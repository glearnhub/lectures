<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Security Incident Management | Study Notes</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Incident Management Theme: Dark Blue with Orange/Teal Accents */
        .im-dark { color: #0D1B2A; }
        .im-dark-bg { background: #0D1B2A; }
        .im-orange { color: #E67E22; }
        .im-orange-bg { background: #E67E22; }
        .im-teal { color: #008080; }
        .im-teal-bg { background: #008080; }
        .im-red { color: #C0392B; }

        .glass-card-im {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(13, 27, 42, 0.12);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: radial-gradient(circle at 20% 30%, #f5f5f5, #e8e8e8);
            overflow: hidden;
            height: 100vh;
        }

        .slide-container {
            perspective: 1200px;
            transform-style: preserve-3d;
            height: 100%;
            width: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        .slide-container::-webkit-scrollbar {
            width: 6px;
        }
        .slide-container::-webkit-scrollbar-track {
            background: rgba(13, 27, 42, 0.06);
            border-radius: 10px;
        }
        .slide-container::-webkit-scrollbar-thumb {
            background: #E67E22;
            border-radius: 10px;
        }

        .slide-card {
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            transform-style: preserve-3d;
            backface-visibility: hidden;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .grid-particles {
            background-image:
                linear-gradient(rgba(13, 27, 42, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(13, 27, 42, 0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: shiftGrid 20s linear infinite;
        }

        @keyframes shiftGrid {
            0% { background-position: 0 0; }
            100% { background-position: 40px 40px; }
        }

        .progress-fill {
            transition: width 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #f0f0f0;
        }
        ::-webkit-scrollbar-thumb {
            background: #E67E22;
            border-radius: 4px;
        }

        .bulleted-list {
            list-style-type: disc;
            padding-left: 1.5rem;
            margin: 0.75rem 0;
        }
        .bulleted-list li {
            margin: 0.45rem 0;
            line-height: 1.5;
        }
        .numbered-list {
            list-style-type: decimal;
            padding-left: 1.5rem;
            margin: 0.75rem 0;
        }
        .numbered-list li {
            margin: 0.45rem 0;
            line-height: 1.5;
        }

        .text-dark { color: #1A1A2E; }
        .text-dark-secondary { color: #333333; }
        .text-dark-muted { color: #555555; }

        .phase-card {
            transition: all 0.2s ease;
            border: 1px solid rgba(13, 27, 42, 0.08);
        }
        .phase-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        }

        .comparison-table th {
            background: rgba(13, 27, 42, 0.06);
            color: #0D1B2A;
        }
        .comparison-table td,
        .comparison-table th {
            padding: 0.5rem;
            border: 1px solid rgba(13, 27, 42, 0.1);
            text-align: left;
        }
        .comparison-table td {
            color: #333333;
        }

        .key-box {
            background: rgba(230, 126, 34, 0.06);
            border-left: 4px solid #E67E22;
            padding: 0.75rem;
            border-radius: 0.5rem;
        }

        .bcp-box {
            background: rgba(0, 128, 128, 0.06);
            border-left: 4px solid #008080;
            padding: 0.75rem;
            border-radius: 0.5rem;
        }

        .recovery-site {
            transition: all 0.2s ease;
            border: 1px solid rgba(13, 27, 42, 0.08);
        }
        .recovery-site:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        }
    </style>
</head>
<body class="text-dark overflow-hidden h-screen w-screen">

    <div class="relative h-full w-full overflow-hidden">
        <div class="absolute inset-0 grid-particles opacity-60 pointer-events-none"></div>
        <div class="absolute inset-0 bg-gradient-to-br from-white via-orange-50/10 to-white pointer-events-none"></div>

        <div class="absolute top-20 left-10 w-64 h-64 bg-[#E67E22]/5 rounded-full blur-3xl animate-pulse-slow pointer-events-none"></div>
        <div class="absolute bottom-20 right-10 w-80 h-80 bg-[#0D1B2A]/8 rounded-full blur-3xl animate-pulse-slow delay-1000 pointer-events-none"></div>

        <div class="relative z-10 flex flex-col h-full w-full">
            <!-- Top Bar -->
            <div class="fixed top-0 left-0 right-0 p-4 md:p-6 z-30 bg-gradient-to-b from-white/95 to-white/80 backdrop-blur-md border-b border-[#E67E22]/20">
                <div class="flex justify-between items-center mb-2">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-[#E67E22] flex items-center justify-center text-white font-bold text-lg">SIM</div>
                        <div class="hidden md:block">
                            <p class="text-xs text-[#E67E22] font-bold tracking-wider">SECURITY INCIDENT MANAGEMENT</p>
                            <p class="text-[10px] text-dark-muted">Study Notes</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <span id="slideCounter" class="text-sm font-mono bg-white/80 px-3 py-1 rounded-full border border-[#E67E22]/30 text-dark">1 / 17</span>
                        <button id="prevBtn" class="p-2 rounded-full bg-white/80 backdrop-blur border border-[#E67E22]/30 hover:bg-[#E67E22]/10 transition-all duration-300 transform hover:scale-110">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E67E22" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
                        </button>
                        <button id="nextBtn" class="p-2 rounded-full bg-white/80 backdrop-blur border border-[#E67E22]/30 hover:bg-[#E67E22]/10 transition-all duration-300 transform hover:scale-110">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E67E22" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
                        </button>
                    </div>
                </div>
                <div class="w-full h-1.5 bg-gray-200 rounded-full overflow-hidden">
                    <div id="progressFill" class="progress-fill h-full bg-gradient-to-r from-[#E67E22] to-[#008080] rounded-full" style="width: 5.9%"></div>
                </div>
                <p class="text-[10px] text-[#E67E22]/60 text-center mt-2 font-mono tracking-wider">✦ INCIDENT MANAGEMENT · IR PROCESS · BCP · DRP · REPORTING ✦</p>
            </div>

            <!-- Slide Content Area -->
            <div id="slideContainer" class="flex-1 slide-container mt-24 mb-4 px-4">
                <div id="slidesWrapper" class="w-full max-w-6xl mx-auto transition-all duration-700" style="transform-style: preserve-3d;"></div>
            </div>

            <div class="fixed bottom-3 left-1/2 transform -translate-x-1/2 z-30 text-[#E67E22]/40 text-[10px] font-mono bg-white/80 px-3 py-1 rounded-full backdrop-blur-sm border border-[#E67E22]/20">
                ↑↓ Scroll • ← → Navigate slides
            </div>
        </div>
    </div>

    <script>
        // =============================================================
        // SECURITY INCIDENT MANAGEMENT - Complete Study Notes
        // 17-slide presentation with all content
        // =============================================================

        const slidesData = [{
            // Slide 1 - Title
            content: () => `
                    <div class="glass-card-im rounded-3xl p-8 md:p-12 text-center relative min-h-[55vh]">
                        <div class="absolute -top-20 left-1/2 transform -translate-x-1/2 w-48 h-48 bg-[#E67E22]/5 rounded-full blur-3xl animate-pulse"></div>
                        <div class="relative z-10">
                            <div class="flex justify-center mb-4">
                                <div class="w-20 h-20 rounded-full bg-[#E67E22] flex items-center justify-center shadow-[0_0_30px_rgba(230,126,34,0.2)]">
                                    <span class="text-white font-extrabold text-2xl">SIM</span>
                                </div>
                            </div>
                            <h1 class="text-3xl md:text-5xl font-extrabold text-[#0D1B2A] mb-3">Security Incident Management</h1>
                            <div class="w-24 h-1 bg-gradient-to-r from-[#E67E22] to-[#008080] mx-auto mb-4"></div>
                            <p class="text-xl text-dark-secondary">Study Notes</p>
                            <div class="mt-6 flex gap-3 justify-center flex-wrap">
                                <span class="px-3 py-1 rounded-full bg-[#E67E22]/10 border border-[#E67E22]/20 text-sm text-dark-secondary">Incident Management</span>
                                <span class="px-3 py-1 rounded-full bg-[#E67E22]/10 border border-[#E67E22]/20 text-sm text-dark-secondary">IR Process</span>
                                <span class="px-3 py-1 rounded-full bg-[#E67E22]/10 border border-[#E67E22]/20 text-sm text-dark-secondary">BCP</span>
                                <span class="px-3 py-1 rounded-full bg-[#E67E22]/10 border border-[#E67E22]/20 text-sm text-dark-secondary">DRP</span>
                                <span class="px-3 py-1 rounded-full bg-[#E67E22]/10 border border-[#E67E22]/20 text-sm text-dark-secondary">Reporting</span>
                            </div>
                        </div>
                    </div>
                `
        }, {
            // Slide 2 - Security Incident Management
            content: () => `
                    <div class="glass-card-im rounded-3xl p-8 md:p-10">
                        <h2 class="text-3xl md:text-4xl font-bold text-[#0D1B2A] mb-4">1. Security Incident Management</h2>
                        <p class="text-dark-secondary leading-relaxed">Security incident management is the overall discipline of identifying, managing, and learning from events that threaten the confidentiality, integrity, or availability of information and systems. It provides the framework within which incident response, continuity, and recovery activities operate.</p>
                        <div class="grid md:grid-cols-2 gap-3 mt-3">
                            <div class="key-box p-2">
                                <p class="font-bold text-[#E67E22]">Key Concepts</p>
                                <ul class="bulleted-list text-sm text-dark-secondary">
                                    <li><span class="font-bold">Event vs. Incident:</span> Event = observable occurrence; Incident = event that violates security policy</li>
                                    <li><span class="font-bold">Incident classification:</span> Type (malware, unauthorized access, data breach, DoS) and severity</li>
                                    <li><span class="font-bold">Incident prioritization:</span> Based on impact and urgency</li>
                                    <li><span class="font-bold">Chain of custody:</span> Documented trail of evidence handling</li>
                                </ul>
                            </div>
                            <div class="bcp-box p-2">
                                <p class="font-bold text-[#008080]">Program Components</p>
                                <ul class="bulleted-list text-sm text-dark-secondary">
                                    <li>Policies and procedures defining roles and escalation</li>
                                    <li>Dedicated Incident Response Team (IRT/CSIRT)</li>
                                    <li>Tools for detection, logging, and analysis (SIEM, IDS/IPS)</li>
                                    <li>Continuous improvement through lessons-learned reviews</li>
                                </ul>
                            </div>
                        </div>
                    </div>
                `
        }, {
            // Slide 3 - Incident Response Process Overview
            content: () => `
                    <div class="glass-card-im rounded-3xl p-8 md:p-10">
                        <h2 class="text-3xl md:text-4xl font-bold text-[#0D1B2A] mb-4">2. Incident Response Process</h2>
                        <p class="text-dark-secondary">The incident response process is a structured lifecycle for handling security incidents from initial detection through resolution and follow-up. Based on NIST SP 800-61.</p>
                        <div class="grid grid-cols-2 md:grid-cols-3 gap-2 mt-3">
                            <div class="phase-card p-2 bg-[#E67E22]/5 rounded-lg text-center border border-[#E67E22]/20">
                                <p class="font-bold text-[#E67E22] text-sm">Preparation</p>
                                <p class="text-xs text-dark-muted">Policies, tools, training</p>
                            </div>
                            <div class="phase-card p-2 bg-[#E67E22]/5 rounded-lg text-center border border-[#E67E22]/20">
                                <p class="font-bold text-[#E67E22] text-sm">Detection & Analysis</p>
                                <p class="text-xs text-dark-muted">Identify, confirm, assess scope</p>
                            </div>
                            <div class="phase-card p-2 bg-[#E67E22]/5 rounded-lg text-center border border-[#E67E22]/20">
                                <p class="font-bold text-[#E67E22] text-sm">Containment</p>
                                <p class="text-xs text-dark-muted">Short-term + long-term</p>
                            </div>
                            <div class="phase-card p-2 bg-[#E67E22]/5 rounded-lg text-center border border-[#E67E22]/20">
                                <p class="font-bold text-[#E67E22] text-sm">Eradication</p>
                                <p class="text-xs text-dark-muted">Remove root cause</p>
                            </div>
                            <div class="phase-card p-2 bg-[#E67E22]/5 rounded-lg text-center border border-[#E67E22]/20">
                                <p class="font-bold text-[#E67E22] text-sm">Recovery</p>
                                <p class="text-xs text-dark-muted">Restore and validate</p>
                            </div>
                            <div class="phase-card p-2 bg-[#E67E22]/5 rounded-lg text-center border border-[#E67E22]/20">
                                <p class="font-bold text-[#E67E22] text-sm">Post-Incident</p>
                                <p class="text-xs text-dark-muted">Lessons learned</p>
                            </div>
                        </div>
                    </div>
                `
        }, {
            // Slide 4 - IR Process - Preparation & Detection
            content: () => `
                    <div class="glass-card-im rounded-3xl p-8 md:p-10">
                        <h2 class="text-3xl md:text-4xl font-bold text-[#0D1B2A] mb-4">IR Process: Preparation & Detection</h2>
                        <div class="grid md:grid-cols-2 gap-3">
                            <div class="p-3 bg-[#E67E22]/5 rounded-lg border-l-4 border-[#E67E22]">
                                <p class="font-bold text-[#E67E22]">Preparation</p>
                                <ul class="bulleted-list text-sm text-dark-secondary">
                                    <li>Establish policies and procedures</li>
                                    <li>Deploy detection and logging tools</li>
                                    <li>Train the IR team</li>
                                    <li>Develop playbooks for common incidents</li>
                                    <li>Run tabletop exercises</li>
                                </ul>
                            </div>
                            <div class="p-3 bg-[#008080]/5 rounded-lg border-l-4 border-[#008080]">
                                <p class="font-bold text-[#008080]">Detection and Analysis</p>
                                <ul class="bulleted-list text-sm text-dark-secondary">
                                    <li>Identify potential incidents through alerts, logs, reports</li>
                                    <li>Confirm and assess scope of the incident</li>
                                    <li>Determine if it is a security incident</li>
                                    <li>Gather initial evidence</li>
                                    <li>Document findings</li>
                                </ul>
                            </div>
                        </div>
                    </div>
                `
        }, {
            // Slide 5 - IR Process - Containment, Eradication, Recovery
            content: () => `
                    <div class="glass-card-im rounded-3xl p-8 md:p-10">
                        <h2 class="text-3xl md:text-4xl font-bold text-[#0D1B2A] mb-4">IR Process: Containment, Eradication, Recovery</h2>
                        <div class="grid md:grid-cols-3 gap-3">
                            <div class="p-3 bg-[#E67E22]/5 rounded-lg border-l-4 border-[#E67E22]">
                                <p class="font-bold text-[#E67E22]">Containment</p>
                                <ul class="bulleted-list text-sm text-dark-secondary">
                                    <li><span class="font-bold">Short-term:</span> Stop immediate damage</li>
                                    <li><span class="font-bold">Long-term:</span> Allow continued operation while remediating</li>
                                    <li>Isolate affected systems</li>
                                    <li>Preserve evidence</li>
                                </ul>
                            </div>
                            <div class="p-3 bg-[#008080]/5 rounded-lg border-l-4 border-[#008080]">
                                <p class="font-bold text-[#008080]">Eradication</p>
                                <ul class="bulleted-list text-sm text-dark-secondary">
                                    <li>Remove the root cause</li>
                                    <li>Eliminate malware, unauthorized accounts</li>
                                    <li>Patch vulnerabilities</li>
                                    <li>Remove attacker footholds</li>
                                </ul>
                            </div>
                            <div class="p-3 bg-[#0D1B2A]/5 rounded-lg border-l-4 border-[#0D1B2A]">
                                <p class="font-bold text-[#0D1B2A]">Recovery</p>
                                <ul class="bulleted-list text-sm text-dark-secondary">
                                    <li>Restore systems to normal operation</li>
                                    <li>Validate functionality</li>
                                    <li>Monitor for recurrence</li>
                                    <li>Return to production</li>
                                </ul>
                            </div>
                        </div>
                    </div>
                `
        }, {
            // Slide 6 - Post-Incident & Supporting Practices
            content: () => `
                    <div class="glass-card-im rounded-3xl p-8 md:p-10">
                        <h2 class="text-3xl md:text-4xl font-bold text-[#0D1B2A] mb-4">Post-Incident & Supporting Practices</h2>
                        <div class="grid md:grid-cols-2 gap-3">
                            <div class="p-3 bg-[#E67E22]/5 rounded-lg border-l-4 border-[#E67E22]">
                                <p class="font-bold text-[#E67E22]">Post-Incident Activity</p>
                                <ul class="bulleted-list text-sm text-dark-secondary">
                                    <li>Document the incident thoroughly</li>
                                    <li>Evaluate response effectiveness</li>
                                    <li>Update policies and controls</li>
                                    <li>Conduct lessons-learned review</li>
                                    <li>Share findings with stakeholders</li>
                                </ul>
                            </div>
                            <div class="p-3 bg-[#008080]/5 rounded-lg border-l-4 border-[#008080]">
                                <p class="font-bold text-[#008080]">Supporting Practices</p>
                                <ul class="bulleted-list text-sm text-dark-secondary">
                                    <li>Maintain an Incident Response Plan (IRP)</li>
                                    <li>Run tabletop exercises and simulations</li>
                                    <li>Use playbooks for common incident types</li>
                                    <li>Coordinate with legal, HR, and PR</li>
                                </ul>
                            </div>
                        </div>
                    </div>
                `
        }, {
            // Slide 7 - Business Continuity Planning (BCP) Overview
            content: () => `
                    <div class="glass-card-im rounded-3xl p-8 md:p-10">
                        <h2 class="text-3xl md:text-4xl font-bold text-[#0D1B2A] mb-4">3. Business Continuity Planning (BCP)</h2>
                        <p class="text-dark-secondary">Business Continuity Planning focuses on ensuring that critical business functions can continue during and after a disruptive event, minimizing operational and financial impact.</p>
                        <div class="grid md:grid-cols-2 gap-3 mt-3">
                            <div class="bcp-box p-2">
                                <p class="font-bold text-[#008080]">Core Elements</p>
                                <ul class="bulleted-list text-sm text-dark-secondary">
                                    <li><span class="font-bold">BIA:</span> Business Impact Analysis — identifies critical functions</li>
                                    <li><span class="font-bold">RTO:</span> Recovery Time Objective — max time to restore</li>
                                    <li><span class="font-bold">RPO:</span> Recovery Point Objective — max data loss</li>
                                    <li><span class="font-bold">MTD:</span> Maximum Tolerable Downtime</li>
                                </ul>
                            </div>
                            <div class="key-box p-2">
                                <p class="font-bold text-[#E67E22]">Planning Activities</p>
                                <ul class="bulleted-list text-sm text-dark-secondary">
                                    <li>Identify critical resources: personnel, facilities, technology</li>
                                    <li>Develop continuity strategies (alternate sites, remote work, manual workarounds)</li>
                                    <li>Establish a Business Continuity Team</li>
                                    <li>Create and maintain BCP document</li>
                                    <li>Conduct tabletop exercises and simulations</li>
                                </ul>
                            </div>
                        </div>
                    </div>
                `
        }, {
            // Slide 8 - BCP - Business Impact Analysis
            content: () => `
                    <div class="glass-card-im rounded-3xl p-8 md:p-10">
                        <h2 class="text-3xl md:text-4xl font-bold text-[#0D1B2A] mb-4">BCP — Business Impact Analysis (BIA)</h2>
                        <div class="p-3 bg-[#E67E22]/5 rounded-lg border-l-4 border-[#E67E22]">
                            <p class="font-bold text-[#E67E22]">What is BIA?</p>
                            <p class="text-dark-secondary">Identifies critical business functions, dependencies, and the impact of their loss over time.</p>
                        </div>
                        <div class="grid md:grid-cols-2 gap-3 mt-3">
                            <div class="p-2 bg-white rounded-lg border border-[#0D1B2A]/10">
                                <p class="font-bold text-[#008080]">Key Metrics</p>
                                <ul class="bulleted-list text-sm text-dark-secondary">
                                    <li><span class="font-bold">RTO:</span> Max time to restore a function</li>
                                    <li><span class="font-bold">RPO:</span> Max acceptable data loss</li>
                                    <li><span class="font-bold">MTD:</span> Total time a function can be unavailable</li>
                                </ul>
                            </div>
                            <div class="p-2 bg-white rounded-lg border border-[#0D1B2A]/10">
                                <p class="font-bold text-[#E67E22]">Dependencies</p>
                                <ul class="bulleted-list text-sm text-dark-secondary">
                                    <li>Personnel and skills</li>
                                    <li>Technology and systems</li>
                                    <li>Facilities and office space</li>
                                    <li>Third-party vendors and partners</li>
                                </ul>
                            </div>
                        </div>
                    </div>
                `
        }, {
            // Slide 9 - Disaster Recovery Planning (DRP)
            content: () => `
                    <div class="glass-card-im rounded-3xl p-8 md:p-10">
                        <h2 class="text-3xl md:text-4xl font-bold text-[#0D1B2A] mb-4">4. Disaster Recovery Planning (DRP)</h2>
                        <p class="text-dark-secondary">Disaster Recovery Planning is a subset of business continuity focused specifically on restoring IT systems, applications, and data after a disruptive event.</p>
                        <div class="grid md:grid-cols-2 lg:grid-cols-4 gap-3 mt-3">
                            <div class="recovery-site p-2 bg-[#E67E22]/5 rounded-lg text-center border border-[#E67E22]/20">
                                <p class="font-bold text-[#E67E22] text-sm">Hot Site</p>
                                <p class="text-xs text-dark-muted">Fully operational — immediate takeover</p>
                            </div>
                            <div class="recovery-site p-2 bg-[#008080]/5 rounded-lg text-center border border-[#008080]/20">
                                <p class="font-bold text-[#008080] text-sm">Warm Site</p>
                                <p class="text-xs text-dark-muted">Partially equipped — some setup required</p>
                            </div>
                            <div class="recovery-site p-2 bg-[#0D1B2A]/5 rounded-lg text-center border border-[#0D1B2A]/20">
                                <p class="font-bold text-[#0D1B2A] text-sm">Cold Site</p>
                                <p class="text-xs text-dark-muted">Basic facility — significant setup needed</p>
                            </div>

        // Slide Engine
        let currentIndex = 0;
        const slidesWrapper = document.getElementById('slidesWrapper');
        const slideContainer = document.getElementById('slideContainer');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const slideCounterSpan = document.getElementById('slideCounter');
        const progressFill = document.getElementById('progressFill');

        function renderSlide() {
            if (!slidesWrapper) return;
            slidesWrapper.style.opacity = '0';
            slidesWrapper.style.transform = 'rotateY(15deg) translateZ(-20px)';
            setTimeout(() => {
                slidesWrapper.innerHTML =
                    `<div class="slide-card w-full transition-all duration-700">${slidesData[currentIndex].content()}</div>`;
                slidesWrapper.style.opacity = '1';
                slidesWrapper.style.transform = 'rotateY(0deg) translateZ(0px)';
                slideCounterSpan.innerText = `${currentIndex+1} / ${slidesData.length}`;
                progressFill.style.width = `${((currentIndex + 1) / slidesData.length) * 100}%`;
                if (slideContainer) slideContainer.scrollTop = 0;
            }, 150);
        }

        function nextSlide() {
            if (currentIndex < slidesData.length - 1) { currentIndex++;
                renderSlide(); }
        }

        function prevSlide() {
            if (currentIndex > 0) { currentIndex--;
                renderSlide(); }
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextSlide();
            if (e.key === 'ArrowLeft') prevSlide();
        });
        let touchStartX = 0;
        document.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].screenX; });
        document.addEventListener('touchend', (e) => {
            let endX = e.changedTouches[0].screenX;
            if (endX < touchStartX - 50) nextSlide();
            if (endX > touchStartX + 50) prevSlide();
        });
        prevBtn?.addEventListener('click', prevSlide);
        nextBtn?.addEventListener('click', nextSlide);

        renderSlide();
    </script>
